# Patra Project - Gradle Version Catalog

[versions]
# Core
java = "25"
patra = "0.1.0-SNAPSHOT"

# Spring
spring-boot = "4.0.8"
spring-cloud = "2025.1.3"
spring-cloud-alibaba = "2025.1.0.0"
spring-dependency-management = "1.1.7"

# Code Generation
lombok = "1.18.40"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"

# Utilities
hutool = "5.8.25"
guava = "31.1-jre"
okio = "3.6.0"
icu4j = "76.1"
jsoup = "1.23.2"
# 引用格式化（PAP-110）：citeproc-java 渲染 CSL 样式；样式与 locale 取官方 CSL 仓库发布的 jar（CC BY-SA 3.0）
citeproc-java = "3.5.2"
citation-styles = "26.8"
yauaa = "8.2.0"
ip2region = "3.3.7"
twelvemonkeys = "3.15.2"
webp-imageio = "0.10.0"
# 提醒摘录：评论 Markdown 转纯文本（PAP-123）
commonmark = "0.30.1"
commons-net = "3.11.1"
commons-compress = "1.28.0"
bouncycastle = "1.86"
error-prone = "2.14.0"

# Messaging
xxl-job = "3.2.0"

# API Documentation (swagger-annotations 版本须与 springdoc 传递依赖保持一致)
springdoc = "3.0.1"
swagger-annotations = "2.2.41"
therapi-javadoc = "0.15.0"

# Resilience & Observability
opentelemetry-logback = "2.22.0-alpha"

# Logging
# 覆盖 spring-cloud-alibaba 2025.1.0.0 BOM 锁定的 log4j-core 2.25.1
# 该版本上游发布的 POM 存在未解析占位符 ${error-prone.version}，会导致 Gradle 警告
# 2.25.5 与 Spring Boot 4.0.8 默认版本一致
log4j = "2.25.5"

# Data & Storage
aws-sdk = "2.25.36"
minio = "8.6.0"
httpclient = "4.5.14"

# Security Overrides（安全版本覆盖：上游 BOM / 传递依赖尚未跟进漏洞修复，见 PatraDependencyManagement.kt）
# tomcat：Spring Boot 4.0.8 / 4.1.1 均仍为 11.0.24
tomcat = "11.0.26"
# httpclient5 / httpcore5 / opentelemetry：取 Spring Boot 4.1.1 BOM 的搭配版本
httpclient5 = "5.6.4"
httpcore5 = "5.4.3"
opentelemetry = "1.62.0"
commons-beanutils = "1.11.0"  # 经 commons-validator 1.7 传递引入
spring-retry = "2.0.13"
commons-lang3 = "3.19.0"      # build-logic：spring-boot-gradle-plugin → commons-compress 1.27.1 传递引入 3.16.0

# Testing
junit = "5.11.4"
mockito = "5.15.2"
assertj = "3.27.7"
testcontainers = "1.21.4"
wiremock = "3.10.0"
awaitility = "4.2.2"
greenmail = "2.1.14"
mockftpserver = "3.2.0"
archunit = "1.4.1"
objenesis = "3.4"

# Code Quality
spotbugs-plugin = "6.4.8"
spotbugs = "4.9.8"
jacoco = "0.8.14"
spotless = "7.0.4"
google-java-format = "1.29.0"
ktlint = "1.5.0"

# Build Plugins
kordamp-enforcer = "0.14.0"

[libraries]
# BOMs
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-alibaba-bom = { module = "com.alibaba.cloud:spring-cloud-alibaba-dependencies", version.ref = "spring-cloud-alibaba" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }

# Spring Boot Starters
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-batch = { module = "org.springframework.boot:spring-boot-starter-batch" }

# Spring Cloud
spring-cloud-starter-alibaba-nacos-discovery = { module = "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery" }
spring-cloud-starter-alibaba-nacos-config = { module = "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config" }
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc" }
spring-cloud-starter-loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer" }

# HTTP 客户端（版本由 Spring Boot BOM 管理）
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http" }

# API Documentation
swagger-annotations-jakarta = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swagger-annotations" }
springdoc-openapi-scalar = { module = "org.springdoc:springdoc-openapi-starter-webmvc-scalar", version.ref = "springdoc" }
therapi-javadoc = { module = "com.github.therapi:therapi-runtime-javadoc", version.ref = "therapi-javadoc" }
therapi-javadoc-scribe = { module = "com.github.therapi:therapi-runtime-javadoc-scribe", version.ref = "therapi-javadoc" }

# Spring Framework
spring-web = { module = "org.springframework:spring-web" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-context = { module = "org.springframework:spring-context" }

# Jakarta API
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }

# Lombok & MapStruct
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }

# Utilities
hutool-core = { module = "cn.hutool:hutool-core", version.ref = "hutool" }
hutool-crypto = { module = "cn.hutool:hutool-crypto", version.ref = "hutool" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
commons-net = { module = "commons-net:commons-net", version.ref = "commons-net" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
citeproc-java = { module = "de.undercouch:citeproc-java", version.ref = "citeproc-java" }
citation-styles = { module = "org.citationstyles:styles", version.ref = "citation-styles" }
citation-locales = { module = "org.citationstyles:locales", version.ref = "citation-styles" }
yauaa = { module = "nl.basjes.parse.useragent:yauaa", version.ref = "yauaa" }
ip2region = { module = "org.lionsoul:ip2region", version.ref = "ip2region" }
twelvemonkeys-imageio-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "twelvemonkeys" }
twelvemonkeys-imageio-jpeg = { module = "com.twelvemonkeys.imageio:imageio-jpeg", version.ref = "twelvemonkeys" }
webp-imageio = { module = "com.github.usefulness:webp-imageio", version.ref = "webp-imageio" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }

# Messaging
xxl-job = { module = "com.xuxueli:xxl-job-core", version.ref = "xxl-job" }

# Data & Storage
minio = { module = "io.minio:minio", version.ref = "minio" }

# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
greenmail = { module = "com.icegreen:greenmail", version.ref = "greenmail" }
objenesis = { module = "org.objenesis:objenesis", version.ref = "objenesis" }
mockftpserver = { module = "org.mockftpserver:MockFtpServer", version.ref = "mockftpserver" }

# Testcontainers
testcontainers-core = { module = "org.testcontainers:testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-minio = { module = "org.testcontainers:minio" }
testcontainers-jdbc = { module = "org.testcontainers:jdbc" }
testcontainers-elasticsearch = { module = "org.testcontainers:elasticsearch" }

# WireMock
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

[bundles]
testing = ["junit-jupiter", "assertj-core", "mockito-core", "mockito-junit-jupiter"]
testcontainers = ["testcontainers-core", "testcontainers-junit-jupiter"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
kordamp-enforcer = { id = "org.kordamp.gradle.project-enforcer", version.ref = "kordamp-enforcer" }
