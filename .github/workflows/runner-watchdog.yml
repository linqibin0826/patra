name: Runner Watchdog

# Mac mini runner 每日看门狗：
#   check-runner（ubuntu）：API 查 macmini runner 是否 online——防「静默离线 14 天
#     被 GitHub 自动注销」（2026-08 实际发生，离线 2 个月 registration 被删）。
#   canary（macmini）：docker 可用性 / 磁盘余量 / 无 unhealthy 容器——防「在线但不可用」。
#   巡检失败时由 GitHub 原生通知推给 workflow 提交者（不设自建通知通道）。
# 需要 secrets：
#   RUNNER_ADMIN_TOKEN  fine-grained PAT，仅本仓库 Administration:Read-only
#                       （GITHUB_TOKEN 无权列 self-hosted runners，必须 PAT）
# runner 离线时 check-runner 直接失败，canary 被跳过（不会滞留 queued）。

permissions: {}

on:
  schedule:
    - cron: '0 23 * * *'   # 每日 UTC 23:00（北京 07:00）
  workflow_dispatch:

jobs:
  check-runner:
    name: check-runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 🔎 检查 macmini runner 在线状态
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::RUNNER_ADMIN_TOKEN 未配置（fine-grained PAT，Administration:Read）"; exit 1; }
          STATUS=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '.runners[] | select(.name=="macmini") | .status')
          echo "macmini runner status: ${STATUS:-未注册}"
          [ "$STATUS" = "online" ] || { echo "::error::macmini runner 不在线（${STATUS:-registration 已被 GitHub 移除，需重装}）"; exit 1; }

  canary:
    name: canary
    needs: check-runner
    runs-on: [self-hosted, macmini]
    timeout-minutes: 5
    steps:
      - name: 🐳 Docker 可用性
        run: |
          set -euo pipefail
          docker info --format 'server={{.ServerVersion}}'
          docker ps --format '{{.Names}}' | wc -l
      - name: 🧾 Runner 版本未过期（--disableupdate 后 30 天红线）
        # GitHub 要求禁用自更新的 runner 在新版发布 30 天内手动升级，逾期停止派发任务。
        # 落后天数 = 第一个比当前新的正式版（不含 pre-release）发布至今的天数：
        # 不足 20 天只打 warning（run 仍是绿的、不发通知），满 20 天才失败，留 10 天升级。
        # 升级：闲时重跑 install-github-runner.sh。
        run: |
          set -euo pipefail
          CURRENT="$("$HOME/actions-runner/bin/Runner.Listener" --version)"
          read -r LATEST LAG_DAYS <<<"$(curl -fsSL 'https://api.github.com/repos/actions/runner/releases?per_page=30' \
            | jq -r --arg cur "$CURRENT" --argjson now "$(date +%s)" '
                def ver: ltrimstr("v") | split(".") | map(tonumber);
                [.[] | select((.draft or .prerelease) | not)] as $r
                | ($r | map(.tag_name) | max_by(ver) | ltrimstr("v")) as $latest
                | ($r | map(select((.tag_name | ver) > ($cur | ver)) | .published_at | fromdateiso8601)) as $newer
                | "\($latest) \(if ($newer | length) == 0 then 0 else (($now - ($newer | min)) / 86400 | floor) end)"')"
          echo "当前: ${CURRENT} / 最新: ${LATEST} / 落后: ${LAG_DAYS} 天"
          # 注意 ${VAR} 必须带大括号：macOS bash 3.2 会把紧跟的全角字符并入变量名（unbound variable 实际踩坑）
          if [ "$LAG_DAYS" -ge 20 ]; then
            echo "::error::runner 版本已落后 ${LAG_DAYS} 天（当前 ${CURRENT}，最新 ${LATEST}）。满 30 天 GitHub 将停止派发任务，闲时重跑 install-github-runner.sh"
            exit 1
          elif [ "$CURRENT" != "$LATEST" ]; then
            echo "::warning::runner 有新版 ${LATEST}（当前 ${CURRENT}，已落后 ${LAG_DAYS} 天，满 20 天转为失败），闲时重跑 install-github-runner.sh"
          fi
      - name: 💾 磁盘余量 ≥ 20G
        run: |
          AVAIL=$(df -g / | awk 'NR==2{print $4}')
          echo "可用: ${AVAIL}G"
          [ "$AVAIL" -ge 20 ] || { echo "::error::磁盘余量不足 20G，清理镜像/日志"; exit 1; }
      - name: 🩺 无 unhealthy 容器
        run: |
          UNHEALTHY=$(docker ps --filter health=unhealthy --format '{{.Names}}')
          [ -z "$UNHEALTHY" ] || { echo "::error::存在 unhealthy 容器: $UNHEALTHY"; exit 1; }
