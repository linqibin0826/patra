name: Dependency Submission

# 把后端 Gradle 依赖图提交给 GitHub（Dependency Submission API）：
#   GitHub 静态解析读不懂 Kotlin DSL + version catalog，仓库依赖图里 maven 包为 0，
#   Dependabot 安全告警因此只覆盖前端 npm。本 workflow 实际跑一次 Gradle 依赖解析，
#   把解析结果（含 BOM 管理的传递依赖）提交上去，后端依赖才进入告警范围。
# 只在 main 上、且依赖声明变化时跑：告警只看默认分支；新 CVE 由 GitHub 对已提交的图持续比对，无需定时重交。

on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle.kts'
      - 'build-logic/**/*.kt'   # LinqibinDependencyManagement.kt 定义 BOM 与强制版本
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

concurrency:
  group: dependency-submission
  cancel-in-progress: true

permissions: {}

jobs:
  submit:
    name: submit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # Dependency Submission API 需要写权限
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: 📤 Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: generate-and-submit
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
