name: CD

# 持续部署（多服务，Mac mini 原生构建）：merge 到 main（或手动触发）
#   → detect-changes（ubuntu）算出改动服务（含「改公共面→重建全部」规则）
#   → build-deploy（Mac mini runner）：gradlew bootJar → 原生 arm64 docker build
#     → deploy.sh（部署+健康检查+部署后验证+自动回滚）→ GHCR 归档推送（best-effort）
# 失败通知走 GitHub 原生（App/邮件推给触发者），不设自建通知通道（单人 dev 环境，2026-08-28 决策）。
# 架构决策（2026-08-27）：构建从 ubuntu(QEMU 交叉编译) 搬回 mini 原生——
#   部署不再经翻墙代理拉大镜像（曾致 EOF/20min 超时），amd64 架构错配事故结构性消除；
#   GHCR 从「部署必经之路」降级为「归档/回滚备源」，推送失败不阻塞部署。
# 服务清单 SSOT：patra-infra/cd/services.json；部署逻辑：patra-infra/cd/deploy.sh。
# 安全：只监听 push:main 与 workflow_dispatch，不监听 pull_request——
#       self-hosted runner 只构建/执行已合并 main 的代码，信任边界与旧架构一致。

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'patra-api/**'
      - 'linqibin-commons/**'
      - 'patra-starters/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'patra-infra/docker/**'
      - 'patra-infra/cd/**'
      - '.github/workflows/cd.yml'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      service:
        description: '部署哪个服务（留空/all=全部改动判定；单服务名配合 image_tag 回滚）'
        required: false
        default: ''
      image_tag:
        description: '镜像 tag（留空=构建并部署本次 commit；回滚填旧 sha，需配合单 service）'
        required: false
        default: ''

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 1) 算出本次需要 build/deploy 的服务 ----
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: 📥 Checkout（全历史，detect 需 git diff）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔍 Detect changed services
        id: detect
        # 通过 env 传入而非直接 ${{ }} 插值到 shell，避免 workflow_dispatch 输入的脚本注入
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SERVICE: ${{ github.event.inputs.service }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          # 受影响单元路由（结构化对象）；CD 部署服务 = backend_units 去掉 foundation
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            R=$(bash patra-infra/cd/detect-changes.sh dispatch "$DISPATCH_SERVICE")
          else
            R=$(bash patra-infra/cd/detect-changes.sh push "$EVENT_BEFORE" "$EVENT_SHA")
          fi
          SERVICES=$(echo "$R" | jq -c '[.backend_units[] | select(. != "foundation")]')
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "受影响单元: $R"
          echo "本次构建/部署服务: $SERVICES"

  # ---- 2) Mac mini 上原生构建 + 部署（单 job；回滚时跳过构建步骤）----
  build-deploy:
    name: build-deploy
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: [self-hosted, macmini]
    timeout-minutes: 40   # 冷 Gradle 缓存全量约 30min；热缓存单服务 ~5-10min
    permissions:
      contents: read
      packages: write   # GHCR 归档推送
    env:
      # macOS runner 不走 docker login（launchd 非交互无法解锁钥匙串 -25308），
      # 凭据 base64 写入 DOCKER_CONFIG/config.json 绕过钥匙串。
      DOCKER_CONFIG: ${{ github.workspace }}/.patra-docker-cfg
      SERVICES: ${{ needs.detect-changes.outputs.services }}
      IMAGE_TAG_INPUT: ${{ github.event.inputs.image_tag }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔑 配置 GHCR 凭据（写 auths + 软链 compose 插件，绕过 macOS 钥匙串）
        run: |
          mkdir -p "$DOCKER_CONFIG"
          ln -sf "$HOME/.docker/cli-plugins" "$DOCKER_CONFIG/cli-plugins"
          AUTH=$(printf '%s' "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > "$DOCKER_CONFIG/config.json"

      - name: 🔨 Build bootJars（仅非回滚；单次 gradlew 聚合全部改动服务）
        if: env.IMAGE_TAG_INPUT == ''
        run: |
          set -euo pipefail
          TASKS=""
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            TASKS="$TASKS $(jq -r --arg s "$svc" '.services[]|select(.name==$s)|.gradleTask' patra-infra/cd/services.json)"
          done
          echo "gradle 任务:$TASKS"
          # JAVA_HOME 来自 runner 的 .env（mise 全局 Zulu 25，与 MacBook 同套，见 install-github-runner.sh）
          # shellcheck disable=SC2086  # $TASKS 需要词拆分（多个 gradle task）
          ./gradlew $TASKS

      - name: 🐳 Build images（原生 arm64，产物直接留在本机 daemon）
        if: env.IMAGE_TAG_INPUT == ''
        run: |
          set -euo pipefail
          TAG="${{ github.sha }}"
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            IMG=$(jq -r --arg s "$svc" '.services[]|select(.name==$s)|.image' patra-infra/cd/services.json)
            CTX=$(jq -r --arg s "$svc" '.services[]|select(.name==$s)|.context' patra-infra/cd/services.json)
            PORT=$(jq -r --arg s "$svc" '.services[]|select(.name==$s)|.port' patra-infra/cd/services.json)
            echo "===== build ${svc} ====="
            docker build -f patra-infra/docker/service.Dockerfile \
              --build-arg "APP_PORT=$PORT" \
              -t "$IMG:$TAG" -t "$IMG:latest" "$CTX"
          done

      - name: 🚀 Deploy（部署+健康检查+部署后验证+自动回滚，逻辑在 deploy.sh）
        run: |
          TAG="${IMAGE_TAG_INPUT:-${{ github.sha }}}"
          bash patra-infra/cd/deploy.sh "$TAG" "$SERVICES"

      - name: 📦 GHCR 归档推送（best-effort：GHCR 只是回滚备源，失败不阻塞部署）
        if: env.IMAGE_TAG_INPUT == ''
        continue-on-error: true
        run: |
          TAG="${{ github.sha }}"
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            IMG=$(jq -r --arg s "$svc" '.services[]|select(.name==$s)|.image' patra-infra/cd/services.json)
            docker push "$IMG:$TAG" && docker push "$IMG:latest" || echo "::warning::$IMG 归档推送失败（不阻塞）"
          done

      - name: 🧹 清理 GHCR 凭据（self-hosted 持久 workspace，防 config.json 落盘残留）
        if: always()
        run: rm -rf "$DOCKER_CONFIG"
