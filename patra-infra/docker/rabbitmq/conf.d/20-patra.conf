## Patra 对 RabbitMQ 的配置，挂到 /etc/rabbitmq/conf.d/，排在镜像自带的 10-defaults.conf 之后。
## 改完在 mini 上 git pull，再 docker restart patra-rabbitmq 生效。

## 可用内存按容器上限算，必须和 docker-compose.core.yaml 里 rabbitmq 的 limits.memory 一致。
## RabbitMQ 不读容器的内存上限，不写这一行就按整台机器的内存算水位，
## 用量涨到上限时直接被 OOM 杀掉，等不到它自己限流。
## 内存水位用默认的 0.6：用量超过约 460 MiB 时暂停接收新消息，发送方阻塞到降下来为止。
## 本机实测空闲约 210 MiB（大半是 Erlang 虚拟机预留未用的内存），连发 2 万条 1 KB 消息时约 290 MiB。
total_memory_available_override_value = 768MiB

## 磁盘剩余不足 2 GB 时同样暂停接收新消息（默认只有 50 MB，磁盘真满了 PG 等也会一起出问题）。
disk_free_limit.absolute = 2GB
