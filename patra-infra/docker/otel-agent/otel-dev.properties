# OpenTelemetry Java Agent 配置 - 开发环境
# 文档: https://opentelemetry.io/docs/languages/java/configuration/

# ============================================================
# 服务标识
# ============================================================
# otel.service.name 会自动从 spring.application.name 读取，无需配置
# 如需覆盖，可在 VM 参数中指定: -Dotel.service.name=xxx
otel.resource.attributes=service.namespace=patra,deployment.environment=dev

# ============================================================
# OTLP 导出配置
# ============================================================
# Collector 端点。提交默认值用 localhost:4318（HTTP/protobuf）——避免把私网 IP 写死进仓库。
# 指向远程 collector（如 Mac mini，tailscale 内网）请用环境变量覆盖（优先级高于本配置文件）：
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://<collector-ip>:4318
# 协议为 OTLP/HTTP（agent 2.x 默认），端口须是 collector 的 4318；gRPC 对应 4317。
# 跨 tailscale 时用 tailscale IP 而非 MagicDNS 主机名：JVM 的 nonProxyHosts 白名单按 IP 配（localhost|127.*|100.*），
# 主机名不匹配会被 Shadowrocket 代理拦截致 export 失败（unexpected end of stream）；IP 命中 100.* 即直连。
otel.exporter.otlp.endpoint=http://localhost:4318
otel.exporter.otlp.protocol=http/protobuf

# ============================================================
# Traces 配置
# ============================================================
otel.traces.exporter=otlp
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=1.0

# ============================================================
# Metrics 配置
# ============================================================
# 指标不经 Agent：各服务由 patra-tool-observability 的 Micrometer OTLP 注册表直接推给 Collector，
# Agent 再导出就会重复一份
otel.metrics.exporter=none

# ============================================================
# Logs 配置
# ============================================================
otel.logs.exporter=otlp
