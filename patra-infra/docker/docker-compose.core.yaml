version: "3.9"

name: patra-core

# Core infrastructure services required for application runtime
# These services are essential and should always be running

services:
  postgres:
    image: postgres:17
    container_name: patra-postgres
    restart: unless-stopped
    ports: [ "15432:5432" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      TZ: Asia/Shanghai
    volumes:
      - ${HOME}/.patra/docker/postgres/data:/var/lib/postgresql/data
      # init 脚本走仓库内相对路径（与 mysql-ops 风格一致），git pull 后变更自动生效；
      # 只在 data 目录为空时由 postgres 镜像执行一次。
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0.15
    container_name: patra-redis
    restart: unless-stopped
    ports: [ "16379:6379" ]
    env_file:
      - path: ${HOME}/.patra/secrets/redis.env
        required: true
    # 密码只来自 redis.env。为空时拒绝启动：--requirepass "" 会让 default 回到 nopass
    command: [ "sh", "-c", "[ -n \"$$REDIS_PASSWORD\" ] || { echo 'REDIS_PASSWORD 为空，拒绝无密码启动' >&2; exit 1; }; exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\"" ]
    volumes:
      - ${HOME}/.patra/docker/redis/data:/data
      - ${HOME}/.patra/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      # redis-cli 被拒时退出码也是 0，所以要核对输出是 PONG
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v3.0.2
    container_name: patra-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE}
      - JVM_XMS=256m
      - JVM_XMX=256m
      - TZ=Asia/Shanghai
    ports:
      - "8848:8848"   # HTTP / OpenAPI / 老控制台
      - "9848:9848"   # gRPC（2.x+ 客户端心跳与变更推送，缺则只能 HTTP 握手）
      - "8080:8080"   # 新版控制台
    volumes:
      - ${HOME}/.patra/docker/nacos/data:/home/nacos/data
      - ${HOME}/.patra/docker/nacos/logs:/home/nacos/logs
    healthcheck:
      # Nacos 3.x：v1 路径已 deprecated（410 Gone），健康端点搬到 8080 新控制台
      test: [ "CMD-SHELL", "curl -fs http://localhost:8080/v3/console/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    # 各子栈独立 project，共享外部网络 patra-net（由 scripts/compose-all.sh 首次创建）
    name: patra-net
    external: true
