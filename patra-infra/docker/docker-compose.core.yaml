name: patra-core

# Core infrastructure services required for application runtime
# These services are essential and should always be running

services:
  postgres:
    image: postgres:17
    container_name: patra-postgres
    restart: unless-stopped
    ports: [ "15432:5432" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      TZ: Asia/Shanghai
    volumes:
      - ${HOME}/.patra/docker/postgres/data:/var/lib/postgresql/data
      # init 脚本走仓库内相对路径（与 mysql-ops 风格一致），git pull 后变更自动生效；
      # 只在 data 目录为空时由 postgres 镜像执行一次。
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0.15
    container_name: patra-redis
    restart: unless-stopped
    ports: [ "16379:6379" ]
    env_file:
      - path: ${HOME}/.patra/secrets/redis.env
        required: true
    # 密码只来自 redis.env。为空时拒绝启动：--requirepass "" 会让 default 回到 nopass
    command: [ "sh", "-c", "[ -n \"$$REDIS_PASSWORD\" ] || { echo 'REDIS_PASSWORD 为空，拒绝无密码启动' >&2; exit 1; }; exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\"" ]
    volumes:
      - ${HOME}/.patra/docker/redis/data:/data
      - ${HOME}/.patra/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      # redis-cli 被拒时退出码也是 0，所以要核对输出是 PONG
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    # 开发环境的邮件收集器：identity 默认往这里发（spring.mail.host 跟随 PATRA_INFRA_HOST），
    # mini 放了 ~/.patra/secrets/mail.env 后才改发真实服务商。只在 tailnet 内可达，和其他基础设施一样不设密码
    image: axllent/mailpit:v1.31.6
    container_name: patra-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI：http://linqibins-mac-mini:8025
    environment:
      TZ: Asia/Shanghai
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes:
      - ${HOME}/.patra/docker/mailpit:/data
    healthcheck:
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: patra-nacos
    # 固定 hostname：容器重建后 hostname 一变，jraft 身份对不上，会选不出 leader
    hostname: patra-nacos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # token 签名密钥与 identity，放在仓库外（见 README「密钥」）。缺失时 compose 拒绝执行。
      # 三项鉴权变量不要再写进下面的 environment：environment 优先于 env_file，插值出的空值会盖掉文件里的值
      - path: ${HOME}/.patra/secrets/nacos-server.env
        required: true
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - NACOS_AUTH_ENABLE=true
      # 存储：业务 PG 里的 patra_nacos 库（官方 PG 插件，镜像自带）。建表见 postgres/init-scripts/03-nacos-schema.sh
      - SPRING_DATASOURCE_PLATFORM=postgresql
      - DB_URL_0=jdbc:postgresql://postgres:5432/patra_nacos?currentSchema=public&ApplicationName=nacos&connectTimeout=5&socketTimeout=30&tcpKeepAlive=true&sslmode=disable
      - DB_USER_0=postgres
      - DB_PASSWORD_0=${POSTGRES_PASSWORD:-123456}
      # 不显式指定时回落到 MySQL 驱动，启动失败
      - DB_POOL_CONFIG_DRIVERCLASSNAME=org.postgresql.Driver
      - DB_POOL_CONFIG_MAXIMUMPOOLSIZE=5
      - DB_POOL_CONFIG_MINIMUMIDLE=1
      - DB_POOL_CONNECTION_TIMEOUT=5000
      - JVM_XMS=256m
      - JVM_XMX=256m
      - TZ=Asia/Shanghai
    ports:
      - "8848:8848"   # HTTP / OpenAPI / 老控制台
      - "9848:9848"   # gRPC（2.x+ 客户端心跳与变更推送，缺则只能 HTTP 握手）
      - "8080:8080"   # 新版控制台
    volumes:
      - ${HOME}/.patra/docker/nacos/data:/home/nacos/data
      - ${HOME}/.patra/docker/nacos/logs:/home/nacos/logs
    healthcheck:
      # Nacos 3.x：v1 路径已 deprecated（410 Gone），健康端点搬到 8080 新控制台
      test: [ "CMD-SHELL", "curl -fs http://localhost:8080/v3/console/health/readiness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    # 消息中间件：interaction、identity 经它把集成事件送给 notification（v0.16 决策 E）。
    # 安全邮件的一次性令牌链接会经过这里的消息，所以和其他基础设施一样只在 tailnet 与局域网内可达，不进公网隧道
    image: rabbitmq:4.4.0-management
    container_name: patra-rabbitmq
    # 固定 hostname：节点名是 rabbit@<hostname>，数据目录按节点名分。容器重建后 hostname 一变，
    # RabbitMQ 会当成新节点另起一个空目录，账号和未消费的消息都「消失」
    hostname: patra-rabbitmq
    restart: unless-stopped
    env_file:
      # 密码放在仓库外（见 README「密钥」）。缺失时 compose 拒绝执行
      - path: ${HOME}/.patra/secrets/rabbitmq.env
        required: true
    environment:
      RABBITMQ_DEFAULT_USER: patra
      TZ: Asia/Shanghai
    # 账号只在数据目录为空的首次启动时按 RABBITMQ_DEFAULT_USER / PASS 创建，之后改密码见 README「RabbitMQ」。
    # 密码为空时拒绝启动。最后交回镜像入口脚本：它负责修正目录属主、切到 rabbitmq 用户
    command: [ "sh", "-c", "[ -n \"$$RABBITMQ_PASSWORD\" ] || { echo 'RABBITMQ_PASSWORD 为空，拒绝无密码启动' >&2; exit 1; }; RABBITMQ_DEFAULT_PASS=\"$$RABBITMQ_PASSWORD\" exec docker-entrypoint.sh rabbitmq-server" ]
    ports:
      - "5672:5672"     # AMQP（应用连这个）
      - "15672:15672"   # 管理界面：http://linqibins-mac-mini:15672
    volumes:
      - ${HOME}/.patra/docker/rabbitmq/data:/var/lib/rabbitmq
      # 内存与磁盘水位，和下面的内存上限一起改
      - ./rabbitmq/conf.d/20-patra.conf:/etc/rabbitmq/conf.d/20-patra.conf:ro
    deploy:
      resources:
        limits:
          # 和 rabbitmq/conf.d/20-patra.conf 的 total_memory_available_override_value 一起改
          memory: 768m
    healthcheck:
      # 以 rabbitmq 用户执行：用 root 跑命令行工具，首次启动时可能抢先建出 root 属主的 .erlang.cookie，节点随即读不了而退出。
      # 端口能连上才算就绪；触发内存或磁盘告警（发布方被阻塞）时也判为不健康
      test: [ "CMD-SHELL", "gosu rabbitmq rabbitmq-diagnostics -q check_port_connectivity && gosu rabbitmq rabbitmq-diagnostics -q check_local_alarms" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

networks:
  default:
    # 各子栈独立 project，共享外部网络 patra-net（由 scripts/compose-all.sh 首次创建）
    name: patra-net
    external: true
