name: patra-apps

# Patra 应用容器栈（与基础设施容器同在外部网络 patra-net）。
# 镜像由 CD（.github/workflows/cd.yml）构建推送到 GHCR，本文件只负责在 Mac mini 上编排运行。
# 镜像 tag 由 deploy job 通过 {SVC}_IMAGE_TAG 注入；手动 compose-all.sh up apps 时回退 latest。
#
# env_file 按「本地变量、密钥」叠加（后者覆盖同名）：
#   .env.common   本地变量 PATRA_INFRA_HOST、PATRA_LOG_DIR。5 个后端服务的其余配置都在 Nacos（patra-infra/nacos/dev/）
#   ${HOME}/.patra/secrets/*.env   密钥，放在仓库外（见 README「密钥」）：
#     redis.env     Redis 密码。catalog、identity 必需（gateway 经 identity 查会话，不连 Redis）
#     gateway.env   网关签身份断言的私钥。gateway 必需
#     nacos.env     Nacos 应用账号 patra-app。5 个后端服务必需
#     mail.env      真实邮件服务商（Resend）的 SMTP 凭据。identity 可选，缺失时邮件发往 core 栈的 Mailpit
#     <svc>.env     外部数据源密钥等。可选，缺失时跳过
# 必需文件缺一个，compose 对本项目的任何命令都会失败（portal 也部署不了），报错里有完整路径。
# 密钥不放在 compose 目录：CD 每次运行前的 git clean 会删掉 runner 工作区里被忽略的文件。
#
# 服务清单 SSOT 见 patra-infra/cd/services.json（端口/镜像/构建上下文/部署顺序）。

# 容器里把 mini 的主机名指向 OrbStack 宿主机网关：应用与 IDE 同用「主机名 + 宿主机映射端口」
# 访问基础设施，且不经过 tailscale（见 docs/patra/specs/2026-10-13-infra-access-unification-design.md）。
x-infra-hosts: &infra-hosts
  - "linqibins-mac-mini:host-gateway"

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 15
  start_period: 60s

services:
  registry:
    image: ghcr.io/linqibin0826/patra-registry:${REGISTRY_IMAGE_TAG:-latest}
    container_name: patra-registry
    restart: unless-stopped
    # 内存上限（2026-10-26）：镜像以 -XX:MaxRAMPercentage=75 启动，不设上限时每个 JVM 的堆可涨到整个 OrbStack
    # 虚拟机内存的 75%；10/25 catalog 回填时堆膨胀把虚拟机撑满，被内核全局 OOM 杀掉。设上限后堆为上限的 75%
    deploy:
      resources:
        limits:
          memory: 1g
    ports: [ "6000:6000" ]
    extra_hosts: *infra-hosts
    env_file:
      - .env.common
      - path: ${HOME}/.patra/secrets/nacos.env
        required: true
      - path: ${HOME}/.patra/secrets/registry.env
        required: false
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:6000/actuator/health" ]
      <<: *app-healthcheck

  catalog:
    image: ghcr.io/linqibin0826/patra-catalog:${CATALOG_IMAGE_TAG:-latest}
    container_name: patra-catalog
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    ports: [ "6300:6300" ]
    extra_hosts: *infra-hosts
    env_file:
      - .env.common
      - path: ${HOME}/.patra/secrets/nacos.env
        required: true
      - path: ${HOME}/.patra/secrets/redis.env
        required: true
      - path: ${HOME}/.patra/secrets/catalog.env
        required: false
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:6300/actuator/health" ]
      <<: *app-healthcheck

  interaction:
    image: ghcr.io/linqibin0826/patra-interaction:${INTERACTION_IMAGE_TAG:-latest}
    container_name: patra-interaction
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    ports: [ "6500:6500" ]
    extra_hosts: *infra-hosts
    # 不连 Redis，不加 redis.env；XXL-Job 执行器 6501 不映射：调度中心经 patra-net 回调容器 IP
    env_file:
      - .env.common
      - path: ${HOME}/.patra/secrets/nacos.env
        required: true
      - path: ${HOME}/.patra/secrets/interaction.env
        required: false
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:6500/actuator/health" ]
      <<: *app-healthcheck

  identity:
    image: ghcr.io/linqibin0826/patra-identity:${IDENTITY_IMAGE_TAG:-latest}
    container_name: patra-identity
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 10/26 回填结束后实测 954.6MiB / 1GiB（93%），上调留余量
          memory: 1536m
    ports: [ "6400:6400" ]
    extra_hosts: *infra-hosts
    env_file:
      - .env.common
      - path: ${HOME}/.patra/secrets/nacos.env
        required: true
      - path: ${HOME}/.patra/secrets/redis.env
        required: true
      - path: ${HOME}/.patra/secrets/identity.env
        required: false
      - path: ${HOME}/.patra/secrets/mail.env
        required: false
    # IP 属地的离线库（PAP-99）：两个 xdb 由 scripts/fetch-ip2region.sh 下载到宿主机，只读挂进来；缺文件 identity 起不来
    volumes:
      - ${HOME}/.patra/data/ip2region:/data/ip2region:ro
    environment:
      PATRA_IDENTITY_IP_GEOLOCATION_DIRECTORY: /data/ip2region
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:6400/actuator/health" ]
      <<: *app-healthcheck

  gateway:
    image: ghcr.io/linqibin0826/patra-gateway:${GATEWAY_IMAGE_TAG:-latest}
    container_name: patra-gateway
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    ports: [ "9528:9528" ]
    extra_hosts: *infra-hosts
    env_file:
      - .env.common
      - path: ${HOME}/.patra/secrets/nacos.env
        required: true
      - path: ${HOME}/.patra/secrets/gateway.env
        required: true
    # 受信代理（PAP-99）：只有门户（下面 portal 的固定地址）发来的 X-Forwarded-For 被采用，两处一起改
    environment:
      PATRA_GATEWAY_TRUSTED_PROXIES: 192.168.97.250/32
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:9528/actuator/health" ]
      <<: *app-healthcheck

  portal:
    image: ghcr.io/linqibin0826/patra-portal:${PORTAL_IMAGE_TAG:-latest}
    container_name: patra-portal
    restart: unless-stopped
    ports: [ "4000:4000" ]
    # 固定地址：网关只信任这个地址发来的 X-Forwarded-For（上面 gateway 的 PATRA_GATEWAY_TRUSTED_PROXIES），
    # 两处要一起改。选 .250 是避开 Docker 从 .2 起的顺序分配；
    # .1 是 patra-net 网关，OrbStack 端口转发进来的连接都显示成它，不能当受信地址（PAP-99）
    networks:
      default:
        ipv4_address: 192.168.97.250
    # portal 是 BFF（Next.js Node server），不读 .env.common（那是 Spring/Nacos/MinIO，portal 用不到）
    env_file:
      - .env.portal
      - path: ${HOME}/.patra/secrets/portal.env
        required: false
    healthcheck:
      # busybox wget（node:alpine 自带，免装 curl）；/api/health 不依赖 gateway
      # 用 127.0.0.1 而非 localhost：容器内 localhost 先解析 ::1（IPv6），
      # 而 Next.js standalone 只监听 IPv4，busybox wget 无回退会 Connection refused
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4000/api/health" ]
      <<: *app-healthcheck

  learn:
    image: ghcr.io/linqibin0826/patra-learn:${LEARN_IMAGE_TAG:-latest}
    container_name: patra-learn
    restart: unless-stopped
    ports: [ "4001:4001" ]
    # learn 是纯静态学习站（无后端依赖），不读 .env.common
    env_file:
      - .env.learn
    healthcheck:
      # 用 127.0.0.1 而非 localhost：容器内 localhost 先解析 ::1（IPv6），
      # 而 Next.js standalone 只监听 IPv4（同 portal 的坑）
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4001/api/health" ]
      <<: *app-healthcheck

networks:
  default:
    # 各子栈独立 project，共享外部网络 patra-net（由 scripts/compose-all.sh 首次创建）
    name: patra-net
    external: true
