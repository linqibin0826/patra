# 可观测性服务 - OpenTelemetry + Grafana Stack
# 统一的 Metrics/Logs/Traces 采集平台
#
# 版本矩阵（2025-12-01）:
# - OTel Collector: 0.140.1
# - Prometheus: 3.7.3
# - Loki: 3.6.2
# - Tempo: 2.9.0
# - Grafana: 12.3.0
# - Alertmanager: 0.29.0
#
# 资源限制说明:
# - OTel Collector: 2G（处理高吞吐量 OTLP 数据，含发送队列缓冲）
# - Prometheus: 512M（7 天数据保留）
# - Loki/Tempo: 512M（标准日志/追踪存储）
# - Grafana: 256M（可视化界面）
# - Alertmanager: 128M（告警路由）
#
# 端口分配:
# - 4317: OTel Collector gRPC (OTLP)
# - 4318: OTel Collector HTTP (OTLP)
# - 8889: OTel Collector Prometheus metrics
# - 9090: Prometheus Web UI
# - 3100: Loki Push/Query API
# - 3200: Tempo Query API
# - 3000: Grafana Web UI
# - 9093: Alertmanager Web UI

name: patra-observability

services:
  # OpenTelemetry Collector - 统一接收 Traces/Metrics/Logs
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.1
    container_name: patra-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics 暴露
    environment:
      TZ: Asia/Shanghai
    # 注意：otel/opentelemetry-collector-contrib 是 FROM scratch 镜像
    # 没有 shell、curl、wget 等工具，无法使用传统 healthcheck
    # 可通过宿主机 curl http://localhost:13133 手动验证健康状态
    deploy:
      resources:
        limits:
          memory: 2G
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  # Prometheus - 指标存储与查询
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: patra-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
      - "--enable-feature=native-histograms"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${HOME}/.patra/docker/prometheus/data:/prometheus
    ports:
      - "9090:9090"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # Loki - 日志聚合存储
  loki:
    image: grafana/loki:3.6.2
    container_name: patra-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ${HOME}/.patra/docker/loki/data:/loki
    ports:
      - "3100:3100"
    environment:
      TZ: Asia/Shanghai
    # 注意：grafana/loki 是 FROM scratch 镜像，没有 shell
    # 可通过宿主机 curl http://localhost:3100/ready 验证
    deploy:
      resources:
        limits:
          memory: 512M

  # Tempo - 分布式链路存储
  tempo:
    image: grafana/tempo:2.9.0
    container_name: patra-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ${HOME}/.patra/docker/tempo/data:/var/tempo
    ports:
      - "3200:3200"   # Tempo Query API
      - "9095:9095"   # Tempo internal
    environment:
      TZ: Asia/Shanghai
    # 注意：grafana/tempo 是 FROM scratch 镜像，没有 shell
    # 可通过宿主机 curl http://localhost:3200/ready 验证
    deploy:
      resources:
        limits:
          memory: 512M

  # Grafana - 统一可视化
  grafana:
    image: grafana/grafana:12.3.0
    container_name: patra-grafana
    restart: unless-stopped
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${HOME}/.patra/docker/grafana/data:/var/lib/grafana
    ports:
      - "3000:3000"
    env_file:
      # ClickHouse 只读账号 grafana 的密码，provisioning/datasources/datasources.yaml 展开 $CLICKHOUSE_GRAFANA_PASSWORD。
      # 只放 mini，缺失时 compose 拒绝执行（见 README「ClickHouse」）
      - path: ${HOME}/.patra/secrets/clickhouse-grafana.env
        required: true
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: patra123
      # ClickHouse 数据源插件：启动前同步装好（provisioning 立刻能用），装在 /var/lib/grafana/plugins，即上面的数据卷，
      # 重建容器不用重装。钉版本：不钉时每次启动会自动升小版本。拉不到时的离线装法见 README「ClickHouse」
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.22.1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          # 256M → 384M（PAP-165）：ClickHouse 插件是一个独立的后端进程。本机实测首次启动装插件时约 200 MiB，
          # 10 个并发查询各返回 1 万行时约 130 MiB。30 个并发各返回 20 万行原始数据时插件进程在 384M 下也会被 OOM 杀掉
          # （Grafana 会自动拉起它）：面板要在 ClickHouse 里聚合好再返回，不要把明细整表拉进 Grafana
          memory: 384M
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

  # Alertmanager - 告警路由
  alertmanager:
    image: prom/alertmanager:v0.29.0
    container_name: patra-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${HOME}/.patra/docker/alertmanager/data:/alertmanager
    ports:
      - "9093:9093"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  default:
    # 各子栈独立 project，共享外部网络 patra-net（由 scripts/compose-all.sh 首次创建）
    name: patra-net
    external: true
