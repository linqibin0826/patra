# ============================================================================
# Patra API Gateway - Main Configuration
# ============================================================================
# 统一入口：按路径前缀把请求路由到各微服务（Nacos 发现 + LoadBalancer）。
# Spring Cloud Gateway 的 WebMVC 版（servlet 栈），代理走 Boot 的 RestClient。
# 设计：docs/patra/specs/2026-10-09-gateway-webmvc-design.md
# 鉴权：docs/patra/specs/2026-10-09-gateway-auth-design.md
# 随环境变的值（身份断言公钥、私钥引用）在 Nacos：patra-common.yaml、patra-gateway.yaml
# 查会话经 identity 的内部接口（PAP-106），网关不连 Redis
# ============================================================================

server:
  port: 9528
  # 客户端 IP 的受信转发（PAP-99）：只有 internal-proxies 里的地址（门户）发来的 X-Forwarded-For 被采用，
  # Tomcat RemoteIpValve 据此改写 remoteAddr；其他来源带的一律由 ForwardedHeaderFilter（removeOnly）剥掉。
  # 默认空串 = 谁都不信。不能留 Boot 的默认值：它含 100.64.0.0/10、192.168.0.0/16，tailnet 与
  # OrbStack 端口转发进来的连接都会被当成代理。mini 的值在 docker-compose.apps.yaml 的 gateway 服务块
  # （PATRA_GATEWAY_TRUSTED_PROXIES=门户的固定地址，与 portal 的 ipv4_address 同一个文件）。CIDR，逗号分隔
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${PATRA_GATEWAY_TRUSTED_PROXIES:}
    # 不读请求体就回响应（会话过期的上传回 401）时，Tomcat 先读完最多这么多再关连接，客户端才拿得到状态码
    # 而不是 Broken pipe；默认 2MB。覆盖手机直出原图的大小（PAP-97）
    max-swallow-size: 32MB

spring:
  # 每个请求一个虚拟线程：等下游的时间不占平台线程
  threads:
    virtual:
      enabled: true

  # 网关唯一的 HTTP 客户端：显式用 Reactor Netty，不靠 classpath 自动探测。
  # 读超时是空闲超时：连续这么久收不到下游任何字节才断，不限总时长，大文件慢速下载不被掐断（设计第 6 节）。
  # factory、redirects 写枚举常量原名：配置刷新时 Gateway 用默认转换服务读这两项，不认 reactor、dont-follow
  http:
    clients:
      imperative:
        factory: REACTOR
      connect-timeout: 5s
      read-timeout: 60s
      # 网关不替客户端跟随下游的 3xx
      redirects: DONT_FOLLOW

  cloud:
    # Gateway Route Configuration（WebMVC 版）
    gateway:
      server:
        webmvc:
          # 设了 trusted-proxies 才激活出站的 X-Forwarded-* 头（Host/Port/Proto/Prefix）；
          # 缺它则下游 springdoc 的 servers 还原失败、停在实例地址。它只管出站：入站转发头由上面的
          # server.tomcat.remoteip 与 ForwardedHeaderFilter 处理，出站的 X-Forwarded-For 用处理后的客户端地址。
          trusted-proxies: ".*"
          routes:
            # Registry Service Route
            # Example: /patra-registry/dictionaries/items -> lb://patra-registry/dictionaries/items
            - id: patra-registry
              uri: lb://patra-registry
              predicates:
                - Path=/patra-registry/**
              filters:
                - StripPrefix=1

            # Catalog Service Route
            # Example: /patra-catalog/venues -> lb://patra-catalog/venues
            - id: patra-catalog
              uri: lb://patra-catalog
              predicates:
                - Path=/patra-catalog/**
              filters:
                - StripPrefix=1

            # Identity Service Route（注册、登录、登出、当前用户）
            # Example: /patra-identity/auth/me -> lb://patra-identity/auth/me
            - id: patra-identity
              uri: lb://patra-identity
              predicates:
                - Path=/patra-identity/**
              filters:
                - StripPrefix=1

            # Interaction Service Route（文献库、收藏夹；以后的讨论、关注、通知）
            # Example: /patra-interaction/collections/1 -> lb://patra-interaction/collections/1
            - id: patra-interaction
              uri: lb://patra-interaction
              predicates:
                - Path=/patra-interaction/**
              filters:
                - StripPrefix=1

# ----------------------------------------------------------------------------
# API Documentation Aggregation
# ----------------------------------------------------------------------------
# 通过 Gateway 聚合各微服务的 OpenAPI 文档；各服务的 /v3/api-docs 经已有路由代理到下游
scalar:
  sources:
    - url: /patra-catalog/v3/api-docs
      title: Catalog Service
      slug: catalog
    - url: /patra-registry/v3/api-docs
      title: Registry Service
      slug: registry
    - url: /patra-identity/v3/api-docs
      title: Identity Service
      slug: identity
    - url: /patra-interaction/v3/api-docs
      title: Interaction Service
      slug: interaction

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO

patra:
  web:
    error:
      context-prefix: GW
  http-client:
    http-interface:
      groups:
        # 查会话（PAP-106）：带令牌的请求每个都要等这一跳，identity 卡住时几秒内变成 503
        identity:
          base-url: lb://patra-identity
          connect-timeout: 1s
          read-timeout: 2s
