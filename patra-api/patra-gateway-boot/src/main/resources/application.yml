# ============================================================================
# Patra API Gateway - Main Configuration
# ============================================================================
# 统一入口：按路径前缀把请求路由到各微服务（Nacos 发现 + LoadBalancer）。
# Spring Cloud Gateway 的 WebMVC 版（servlet 栈），代理走 Boot 的 RestClient。
# 设计：docs/patra/specs/2026-10-09-gateway-webmvc-design.md
# 鉴权：docs/patra/specs/2026-10-09-gateway-auth-design.md
# 随环境变的值（Redis、身份断言公钥、私钥引用）在 Nacos：patra-common.yaml、patra-gateway.yaml
# ============================================================================

server:
  port: 9528

spring:
  # 每个请求一个虚拟线程：等下游的时间不占平台线程
  threads:
    virtual:
      enabled: true

  # 网关唯一的 HTTP 客户端：显式用 Reactor Netty，不靠 classpath 自动探测。
  # 读超时是空闲超时：连续这么久收不到下游任何字节才断，不限总时长，大文件慢速下载不被掐断（设计第 6 节）。
  # factory、redirects 写枚举常量原名：配置刷新时 Gateway 用默认转换服务读这两项，不认 reactor、dont-follow
  http:
    clients:
      imperative:
        factory: REACTOR
      connect-timeout: 5s
      read-timeout: 60s
      # 网关不替客户端跟随下游的 3xx
      redirects: DONT_FOLLOW

  # 会话存储：地址、账号在 Nacos 公共配置 patra-common.yaml。
  # 命令超时 2 秒：带令牌的请求每个都要等这一跳，Redis 卡住时几秒内变成 503；建连耗时另计。
  data:
    redis:
      connect-timeout: 5s
      timeout: 2s

  cloud:
    # Gateway Route Configuration（WebMVC 版）
    gateway:
      server:
        webmvc:
          # 设了 trusted-proxies 才激活 X-Forwarded-* 头（Host/Port/Proto/Prefix）；
          # 缺它则下游 springdoc 的 servers 还原失败、停在实例地址。patra 仅 tailscale 内网暴露，dev 信任所有上游。
          trusted-proxies: ".*"
          routes:
            # Ingest Service Route
            # Example: /patra-ingest/plans -> lb://patra-ingest/plans
            - id: patra-ingest
              uri: lb://patra-ingest
              predicates:
                - Path=/patra-ingest/**
              filters:
                - StripPrefix=1

            # Registry Service Route
            # Example: /patra-registry/provenance -> lb://patra-registry/provenance
            - id: patra-registry
              uri: lb://patra-registry
              predicates:
                - Path=/patra-registry/**
              filters:
                - StripPrefix=1

            # Catalog Service Route
            # Example: /patra-catalog/venues -> lb://patra-catalog/venues
            - id: patra-catalog
              uri: lb://patra-catalog
              predicates:
                - Path=/patra-catalog/**
              filters:
                - StripPrefix=1

            # Identity Service Route（注册、登录、登出、当前用户）
            # Example: /patra-identity/auth/me -> lb://patra-identity/auth/me
            - id: patra-identity
              uri: lb://patra-identity
              predicates:
                - Path=/patra-identity/**
              filters:
                - StripPrefix=1

# ----------------------------------------------------------------------------
# API Documentation Aggregation
# ----------------------------------------------------------------------------
# 通过 Gateway 聚合各微服务的 OpenAPI 文档；各服务的 /v3/api-docs 经已有路由代理到下游
scalar:
  sources:
    - url: /patra-catalog/v3/api-docs
      title: Catalog Service
      slug: catalog
    - url: /patra-registry/v3/api-docs
      title: Registry Service
      slug: registry
    - url: /patra-ingest/v3/api-docs
      title: Ingest Service
      slug: ingest
    - url: /patra-identity/v3/api-docs
      title: Identity Service
      slug: identity

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO

patra:
  web:
    error:
      context-prefix: GW
