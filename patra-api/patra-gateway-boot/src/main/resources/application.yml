# ============================================================================
# Patra API Gateway - Main Configuration
# ============================================================================
# This gateway serves as the unified entry point for all Patra services.
# Routes are configured below with Nacos-based service discovery.
# ============================================================================

# ----------------------------------------------------------------------------
# Server Configuration
# ----------------------------------------------------------------------------
server:
  port: 9528

# ----------------------------------------------------------------------------
# Spring Boot & Cloud Configuration
# ----------------------------------------------------------------------------
spring:
  application:
    name: patra-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Cloud Configuration
  cloud:
    # Nacos Service Discovery
    nacos:
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${NACOS_HOST:${PATRA_INFRA_HOST:127.0.0.1}}:${NACOS_PORT:8848}
        service: ${spring.application.name}
        # 显式 false：SCA 2025.1.0.0 默认 true 会让 nacos 3.x gRPC 异步握手未完成时
        # 同步 register 的 -401 Client-not-connected 直接 abort 整个应用启动
        fail-fast: false

    # Gateway Route Configuration
    # Routes requests to downstream microservices using load balancing
    gateway:
      server:
        webflux:
          # 激活 XForwardedHeadersFilter 自动注入 X-Forwarded-Host/Port/Proto（host/port/proto-enabled 默认 true）。
          # SCG 5.x 默认关闭该 filter，须设 trusted-proxies 才激活；缺它则下游 springdoc 的 servers
          # host 还原失败、停在实例地址。patra 仅 tailscale 内网暴露，dev 信任所有上游。
          trusted-proxies: ".*"
          routes:
            # Ingest Service Route
            # Example: /patra-ingest/plans -> lb://patra-ingest/plans
            - id: patra-ingest
              uri: lb://patra-ingest
              predicates:
                - Path=/patra-ingest/**
              filters:
                - StripPrefix=1

            # Registry Service Route
            # Example: /patra-registry/provenance -> lb://patra-registry/provenance
            - id: patra-registry
              uri: lb://patra-registry
              predicates:
                - Path=/patra-registry/**
              filters:
                - StripPrefix=1

            # Catalog Service Route
            # Example: /patra-catalog/venues -> lb://patra-catalog/venues
            - id: patra-catalog
              uri: lb://patra-catalog
              predicates:
                - Path=/patra-catalog/**
              filters:
                - StripPrefix=1

# ----------------------------------------------------------------------------
# API Documentation Aggregation
# ----------------------------------------------------------------------------
# 通过 Gateway 聚合各微服务的 OpenAPI 文档
# 各服务的 /v3/api-docs 请求通过已有路由代理到下游
scalar:
  sources:
    - url: /patra-catalog/v3/api-docs
      title: Catalog Service
      slug: catalog
    - url: /patra-registry/v3/api-docs
      title: Registry Service
      slug: registry
    - url: /patra-ingest/v3/api-docs
      title: Ingest Service
      slug: ingest

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
logging:
  file:
    # Centralized log directory in project root
    path: ${PATRA_LOG_DIR:logs}
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.loadbalancer: INFO

# ----------------------------------------------------------------------------
# Actuator & Monitoring Configuration
# ----------------------------------------------------------------------------
# 注意：Metrics 通过 OTel Agent + Micrometer Bridge 导出到 OTel Collector
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
