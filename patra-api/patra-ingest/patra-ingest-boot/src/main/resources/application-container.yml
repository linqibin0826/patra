spring:
  config:
    activate:
      on-profile: container
  datasource:
    url: ${INGEST_DB_URL}
    username: ${INGEST_DB_USERNAME}
    password: ${INGEST_DB_PASSWORD}

patra:
  starter:
    expr:
      mode:
        strict: true
        multi:
          repeat-enabled: false
      compiler:
        enabled: true
        query-param-bridge:
          enabled: true
        max-query-length: 5000
        warn-param-count: 50
        max-param-count: 100

linqibin:
  starter:
    # 对象存储（prod：环境变量注入；endpoint/凭据见 .env.common，bucket 见 .env.ingest）。
    # dev 默认值在 application-dev.yml；prod 必须显式 externalize，
    # 否则 ObjectStorageAutoConfiguration 报「缺少对象存储提供者配置: minio」启动失败。
    object-storage:
      active-provider: ${OBJECT_STORAGE_PROVIDER:minio}
      providers:
        minio:
          endpoint: ${MINIO_ENDPOINT}
          access-key: ${MINIO_ACCESS_KEY}
          secret-key: ${MINIO_SECRET_KEY}
          bucket: ${MINIO_BUCKET:patra-ingest-cache}
      retry:
        max-attempts: 3
        wait-duration: 1000
