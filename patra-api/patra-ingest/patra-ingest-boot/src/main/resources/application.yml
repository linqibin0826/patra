server:
  port: 6100
  # 解析 Gateway 注入的 X-Forwarded-*（含 Prefix），使 springdoc 生成的 servers 指向对外网关地址
  forward-headers-strategy: framework

spring:
  # Nacos 的 patra-common.yaml、patra-ingest.yaml 由启动器 PatraApplication 导入，这里不写
  config:
    import:
      # Local configuration files (error handling and message queue)
      - "classpath:ingest-error-config.yaml"
      - "classpath:ingest-rocketmq.yaml"
  # 地址随环境变，在 Nacos 的 patra-ingest.yaml；账号、密码在 patra-common.yaml（源文件在 patra-infra/nacos/dev/）
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration

# HTTP Interface 客户端配置（替代 Feign）
linqibin:
  starter:
    http-interface:
      enabled: true
      connect-timeout: 2s
      read-timeout: 5s
      error-handling:
        problem-detail-enabled: true
        tolerant: true
      groups:
        registry:
          base-url: lb://patra-registry
          read-timeout: 10s
        storage:
          base-url: lb://patra-object-storage
          read-timeout: 60s

patra:
  starter:
    # 表达式编译：两种运行方式都用严格模式和长度、参数数上限，其余参数用 starter 默认值
    expr:
      mode:
        strict: true
      compiler:
        max-query-length: 5000
        warn-param-count: 50
        max-param-count: 100
  ingest:
    exec:
      # Lease time-to-live in seconds for execution lock
      lease-ttl-seconds: ${INGEST_LEASE_TTL:60}
      # Heartbeat interval to maintain lease
      heartbeat-interval-seconds: ${INGEST_HEARTBEAT_INTERVAL:20}
    # outbox 中继参数可在线刷新：默认值在 OutboxRelayProperties，要调就在 Nacos 的 patra-ingest.yaml 里加键

xxl:
  job:
    # 管理端地址随环境变，在 Nacos 公共配置 patra-common.yaml
    executor:
      # 回调地址：admin 按它回调本执行器。与 Nacos 注册地址同一个变量；容器里不设，自动探测 patra-net 上的 IP。
      ip: ${PATRA_ADVERTISE_IP:}
      # Log directory in centralized logs folder
      logpath: ${XXL_JOB_EXECUTOR_LOG_PATH:${PATRA_LOG_DIR:logs}/xxl-job/patra-ingest}
      logretentiondays: ${XXL_JOB_LOG_RETENTION_DAYS:30}

task:
  execution:
    lease:
      # Task execution lease duration in seconds
      duration: ${TASK_EXECUTION_LEASE_DURATION:60}
      # Lease renewal interval in seconds
      renewal-interval: ${TASK_EXECUTION_LEASE_RENEWAL_INTERVAL:20}
    heartbeat:
      # Number of consecutive heartbeat failures before task is considered dead
      failure-threshold: ${TASK_EXECUTION_HEARTBEAT_FAILURE_THRESHOLD:3}
    # When true, fail immediately on first error instead of continuing
    fail-fast: ${TASK_EXECUTION_FAIL_FAST:false}

logging:
  file:
    # Centralized log directory in project root
    path: ${PATRA_LOG_DIR:logs}

# ----------------------------------------------------------------------------
# Actuator & Monitoring Configuration
# ----------------------------------------------------------------------------
# 注意：Metrics 通过 OTel Agent + Micrometer Bridge 导出到 OTel Collector
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
