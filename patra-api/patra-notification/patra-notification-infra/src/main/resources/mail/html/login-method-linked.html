<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/fragments/layout :: mail('安全提醒', '绑定了新的登录方式 · LOGIN METHOD LINKED', '你的账号绑定了新的登录方式', ~{::content}, '这是一封账号安全提醒。')}">
<body>
<th:block th:fragment="content">
<p style="margin:16px 0 0 0;"><span th:text="${displayName}">陈宇</span>，你好。<span th:text="|你的 ${siteName} 账号刚刚绑定了 ${providerName} 账号 ${accountLabel}。|">你的 Patra 账号刚刚绑定了 GitHub 账号 octocat。</span></p>
<th:block th:replace="~{html/fragments/security-notice :: notice(${notice})}"></th:block>
<th:block th:replace="~{html/fragments/button :: button(${securityUrl}, '查看登录方式', null)}"></th:block>
</th:block>
</body>
</html>
