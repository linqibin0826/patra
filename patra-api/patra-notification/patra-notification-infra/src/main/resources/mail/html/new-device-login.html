<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/fragments/layout :: mail('安全提醒', '新设备登录 · NEW SIGN-IN', '你的账号在一台新设备上登录', ~{::content}, '这是一封账号安全提醒。')}">
<body>
<th:block th:fragment="content">
<p style="margin:16px 0 0 0;"><span th:text="${displayName}">陈宇</span>，你好。<span th:text="|你的 ${siteName} 账号刚刚在一台新设备上登录。如果是你本人，不用做任何事。|">你的 Patra 账号刚刚在一台新设备上登录。如果是你本人，不用做任何事。</span></p>
<th:block th:replace="~{html/fragments/security-notice :: notice(${notice})}"></th:block>
<th:block th:replace="~{html/fragments/button :: button(${securityUrl}, '检查登录设备', null)}"></th:block>
</th:block>
</body>
</html>
