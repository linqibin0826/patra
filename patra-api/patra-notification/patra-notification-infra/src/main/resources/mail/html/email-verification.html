<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/fragments/layout :: mail('账号通知', '邮箱验证 · VERIFY EMAIL', '确认这是你的邮箱', ~{::content}, |你收到这封邮件，是因为有人用这个地址注册了 ${siteName}。|)}">
<body>
<th:block th:fragment="content">
<p style="margin:16px 0 0 0;"><span th:text="${displayName}">陈宇</span>，你好。<span th:text="|感谢注册 ${siteName}。点下面的按钮，确认这是你在用的邮箱。|">感谢注册 Patra。点下面的按钮，确认这是你在用的邮箱。</span></p>
<th:block th:replace="~{html/fragments/button :: button(${verifyUrl}, '验证邮箱', |${linkExpiresAt} 前有效 · 只能用一次|)}"></th:block>
<p class="p-fg3 p-rule" style="margin:32px 0 0 0;padding-top:20px;border-top:1px solid #e7e1d4;font-size:13px;line-height:1.6;color:#57534e;">不是你注册的？忽略这封邮件即可，不要点按钮。</p>
</th:block>
</body>
</html>
