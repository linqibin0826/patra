<!DOCTYPE html>
<!-- 邮件骨架与共用块。视觉取自 Patra 设计系统：纸色底、墨色字、陶土色是唯一强调色、发丝线分隔。
     邮件客户端不认 flex、多数不加载网页字体：一律 table 布局 + 行内样式 + 系统字体栈。
     <style> 里只放两组增强：窄屏（按钮占满一行）和深色模式（Apple Mail / iOS 认，Gmail 网页版不认，会自己反色），
     用 p-* 类名挂到元素上，覆盖行内颜色要带 !important。 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:fragment="mail(category, eyebrow, heading, content, aside)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title th:text="${subject}">Patra</title>
  <style>
    @media (max-width: 520px) {
      .p-outer { padding: 16px 8px !important; }
      .p-pad { padding-left: 20px !important; padding-right: 20px !important; }
      .p-h1 { font-size: 26px !important; }
      .p-btn { display: block !important; text-align: center !important; }
      .p-btn-note { display: block !important; margin: 12px 0 0 0 !important; text-align: center !important; }
    }
    @media (prefers-color-scheme: dark) {
      .p-bg { background: #141210 !important; }
      .p-card { background: #1c1917 !important; border-color: #3a3531 !important; }
      .p-rule { border-color: #3a3531 !important; }
      .p-rule-strong { border-top-color: #a8a29e !important; border-bottom-color: #3a3531 !important; }
      .p-vrule { background: #4a443e !important; }
      .p-fg1 { color: #fbf8f2 !important; }
      .p-fg2 { color: #e0dacc !important; }
      .p-fg3 { color: #c7c0b6 !important; }
      .p-bar { background: #dc9d6a !important; }
      .p-link { color: #dc9d6a !important; }
      .p-tint { background: #2b211b !important; border-color: #6e3216 !important; }
      .p-warn { background: #2a2418 !important; border-color: #8a6420 !important; }
      .p-warn-ink { color: #dcb46a !important; }
      .p-foot { background: #292524 !important; }
      .p-quote { background: #292524 !important; }
    }
  </style>
</head>
<body class="p-bg" style="margin:0;padding:0;background:#f7f2e8;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" class="p-bg" style="background:#f7f2e8;">
  <tr>
    <td align="center" class="p-outer" style="padding:40px 16px;">
      <!-- 预览文字（提醒邮件）：收件箱列表里显示，正文里看不见；安全邮件不设 -->
      <div th:if="${preheader != null}" style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f7f2e8;" th:text="${preheader}">预览文字</div>
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;">
        <tr>
          <td class="p-card" style="background:#fbf8f2;border:1px solid #ddd5c4;border-radius:12px;overflow:hidden;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
              <!-- 刊头：字标 + 竖线 + 副标，右侧是邮件类别 -->
              <tr>
                <td class="p-pad p-rule" style="padding:20px 36px;border-bottom:1px solid #ddd5c4;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                      <td style="vertical-align:middle;white-space:nowrap;">
                        <span class="p-fg1" style="font-family:Georgia,'Songti SC','Noto Serif SC',serif;font-size:22px;font-weight:500;letter-spacing:-0.01em;color:#1c1917;vertical-align:middle;" th:text="${siteName}">Patra</span>
                        <span class="p-vrule" style="display:inline-block;width:1px;height:16px;margin:0 12px;background:#d6cfc0;vertical-align:middle;"></span>
                        <span class="p-fg3" style="font-family:'SF Mono',Menlo,Consolas,'PingFang SC',monospace;font-size:11px;letter-spacing:0.06em;color:#57534e;vertical-align:middle;">医学文献门户</span>
                      </td>
                      <td align="right" class="p-fg3" style="vertical-align:middle;white-space:nowrap;font-family:'SF Mono',Menlo,Consolas,'PingFang SC',monospace;font-size:11px;letter-spacing:0.08em;color:#57534e;" th:text="${category}">账号通知</td>
                    </tr>
                  </table>
                </td>
              </tr>
              <!-- 正文：栏目小标 + 标题 + 各模板的内容 -->
              <tr>
                <td class="p-pad p-fg2" style="padding:40px 36px 36px 36px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.75;color:#44403c;">
                  <div class="p-fg3" style="font-family:'SF Mono',Menlo,Consolas,'PingFang SC',monospace;font-size:11px;line-height:14px;letter-spacing:0.08em;color:#57534e;">
                    <span class="p-bar" style="display:inline-block;width:4px;height:14px;margin-right:10px;background:#b85727;vertical-align:middle;"></span><span style="vertical-align:middle;" th:text="${eyebrow}">邮箱验证 · VERIFY EMAIL</span>
                  </div>
                  <h1 class="p-h1 p-fg1" style="margin:18px 0 0 0;font-family:Georgia,'Songti SC','Noto Serif SC',serif;font-size:30px;line-height:1.2;font-weight:500;letter-spacing:-0.01em;color:#1c1917;" th:text="${heading}">确认这是你的邮箱</h1>
                  <th:block th:replace="${content}"></th:block>
                </td>
              </tr>
              <!-- 版权页：墨色区块 -->
              <tr>
                <td class="p-pad p-foot" style="padding:28px 36px;background:#1c1917;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;">
                  <p style="margin:0 0 12px 0;font-family:Georgia,'Songti SC','Noto Serif SC',serif;font-size:17px;line-height:1.4;color:#fbf8f2;">医学知识，自古写在叶上。</p>
                  <p style="margin:0;font-size:12px;line-height:1.8;color:#c7c0b6;"><span th:text="${footnote} ?: |此邮件由 ${siteName} 系统自动发出，请勿回复。|">此邮件由 Patra 系统自动发出，请勿回复。</span><br><span th:text="|${siteName} 不会在邮件里向你索要密码。|">Patra 不会在邮件里向你索要密码。</span></p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- 卡片外的一句：为什么收到这封邮件；提醒邮件后面接退订与通知设置两个链接（asideLinks），安全邮件是纯文字 -->
        <tr>
          <td th:if="${asideLinks == null}" class="p-fg3" style="padding:16px 4px 0 4px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.7;color:#57534e;" th:text="${aside}">这是一封账号安全提醒。</td>
          <td th:unless="${asideLinks == null}" class="p-fg3" style="padding:16px 4px 0 4px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.7;color:#57534e;"><th:block th:text="${aside}">你收到这封邮件，是因为……</th:block><th:block th:each="link, iter : ${asideLinks}"><th:block th:unless="${iter.first}"> · </th:block><a class="p-link" th:href="${link.url}" href="#" style="color:#97441e;text-decoration:underline;" th:text="${link.label}">退订这类邮件</a></th:block></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
