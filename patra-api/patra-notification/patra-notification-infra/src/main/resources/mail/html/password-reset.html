<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/fragments/layout :: mail('账号通知', '重设密码 · RESET PASSWORD', '设置一个新密码', ~{::content}, |你收到这封邮件，是因为有人在 ${siteName} 用这个地址申请了重设密码。|)}">
<body>
<th:block th:fragment="content">
<p style="margin:16px 0 0 0;"><span th:text="${displayName}">陈宇</span>，你好。<span th:text="|你申请了重设 ${siteName} 密码，点下面的按钮设置新密码。|">你申请了重设 Patra 密码，点下面的按钮设置新密码。</span></p>
<th:block th:replace="~{html/fragments/button :: button(${resetUrl}, '重设密码', |${linkExpiresAt} 前有效 · 只能用一次|)}"></th:block>
<p class="p-fg3 p-rule" style="margin:32px 0 0 0;padding-top:20px;border-top:1px solid #e7e1d4;font-size:13px;line-height:1.6;color:#57534e;">不是你申请的？忽略这封邮件即可，密码不会变。</p>
</th:block>
</body>
</html>
