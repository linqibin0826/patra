<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/fragments/layout :: mail('安全提醒', '邮箱已改回 · EMAIL RESTORED', '邮箱已改回，请设置新密码', ~{::content}, '这是一封账号安全提醒。')}">
<body>
<th:block th:fragment="content">
<p style="margin:16px 0 0 0;"><span th:text="${displayName}">陈宇</span>，你好。<span th:text="|你撤销了邮箱更改：${siteName} 账号的邮箱已改回本地址，所有设备已下线，原密码已作废。点下面的按钮设置新密码。|">你撤销了邮箱更改：Patra 账号的邮箱已改回本地址，所有设备已下线，原密码已作废。点下面的按钮设置新密码。</span></p>
<th:block th:replace="~{html/fragments/button :: button(${resetUrl}, '设置新密码', |${linkExpiresAt} 前有效 · 只能用一次|)}"></th:block>
<p class="p-fg3" style="margin:16px 0 0 0;font-size:13px;line-height:1.6;color:#57534e;">过期后到登录页点「忘记密码」再申请。</p>
<th:block th:replace="~{html/fragments/security-notice :: notice(${notice})}"></th:block>
</th:block>
</body>
</html>
