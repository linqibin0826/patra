<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 主按钮：陶土色药丸，链接只挂在这里（纯文本部分另有全文）；note 是按钮旁的等宽小字（有效期），可为 null -->
<table th:fragment="button(url, label, note)" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top:28px;">
  <tr>
    <td style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;">
      <a class="p-btn" th:href="${url}" href="#" style="display:inline-block;padding:13px 28px;border-radius:999px;background:#97441e;color:#fbf8f2;text-decoration:none;font-size:15px;font-weight:500;line-height:1.2;vertical-align:middle;" th:text="|${label} →|">验证邮箱 →</a>
      <span class="p-btn-note p-fg3" th:if="${note != null}" style="display:inline-block;margin-left:16px;font-family:'SF Mono',Menlo,Consolas,'PingFang SC',monospace;font-size:12px;letter-spacing:0.04em;color:#57534e;vertical-align:middle;" th:text="${note}">24 小时内有效 · 只能用一次</span>
    </td>
  </tr>
</table>
<!-- 注销到期时刻：琥珀色警示块 -->
<table th:fragment="deadline(dueAt)" role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top:28px;">
  <tr>
    <td class="p-warn" style="padding:20px 22px;background:#f6eeda;border:1px solid #b8862f;border-radius:8px;">
      <div class="p-warn-ink" style="font-family:'SF Mono',Menlo,Consolas,'PingFang SC',monospace;font-size:11px;letter-spacing:0.08em;color:#8a6420;">永久删除时间</div>
      <div class="p-fg1" style="margin-top:8px;font-family:Georgia,'Songti SC','Noto Serif SC',serif;font-size:24px;line-height:1.3;font-weight:500;color:#1c1917;" th:text="${dueAt}">2026-11-04 08:00 (UTC+8)</div>
    </td>
  </tr>
</table>
</body>
</html>
