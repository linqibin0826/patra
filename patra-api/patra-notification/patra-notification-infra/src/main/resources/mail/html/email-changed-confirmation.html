<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/fragments/layout :: mail('安全提醒', '邮箱已更改 · EMAIL CHANGED', '这是你的新登录邮箱', ~{::content}, '这是一封账号安全提醒。')}">
<body>
<th:block th:fragment="content">
<p style="margin:16px 0 0 0;"><span th:text="${displayName}">陈宇</span>，你好。<span th:text="|本地址现在是你 ${siteName} 账号的登录邮箱，之后用它登录和接收通知。|">本地址现在是你 Patra 账号的登录邮箱，之后用它登录和接收通知。</span></p>
<th:block th:replace="~{html/fragments/security-notice :: notice(${notice})}"></th:block>
<p class="p-fg3" style="margin:20px 0 0 0;font-size:13px;line-height:1.6;color:#57534e;">建议立即到<a class="p-link" th:href="${securityUrl}" href="#" style="color:#97441e;">安全设置</a>修改密码并检查登录设备。</p>
</th:block>
</body>
</html>
