<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/fragments/layout :: mail('安全提醒', '邮箱已更改 · EMAIL CHANGED', '你的账号邮箱已更改', ~{::content}, '这是一封账号安全提醒，发到账号原来的登录邮箱。')}">
<body>
<th:block th:fragment="content">
<p style="margin:16px 0 0 0;"><span th:text="${displayName}">陈宇</span>，你好。<span th:text="|你的 ${siteName} 账号邮箱已从本地址改为|">你的 Patra 账号邮箱已从本地址改为</span> <span class="p-fg1" style="color:#1c1917;font-weight:500;" th:text="${newEmailMasked}">c***@example.com</span>，本地址不再能登录。</p>
<th:block th:replace="~{html/fragments/security-notice :: notice(${notice})}"></th:block>
<th:block th:replace="~{html/fragments/button :: button(${revertUrl}, '不是我，撤销更改', |${linkExpiresAt} 前有效|)}"></th:block>
<p class="p-fg3" style="margin:20px 0 0 0;font-size:13px;line-height:1.6;color:#57534e;">建议立即到<a class="p-link" th:href="${securityUrl}" href="#" style="color:#97441e;">安全设置</a>修改密码并检查登录设备。</p>
</th:block>
</body>
</html>
