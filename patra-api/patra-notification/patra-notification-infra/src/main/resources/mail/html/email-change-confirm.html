<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{html/fragments/layout :: mail('账号通知', '更换邮箱 · CONFIRM NEW EMAIL', '确认你的新邮箱', ~{::content}, |你收到这封邮件，是因为有人申请把 ${siteName} 账号的邮箱改为这个地址。|)}">
<body>
<th:block th:fragment="content">
<p style="margin:16px 0 0 0;"><span th:text="${displayName}">陈宇</span>，你好。<span th:text="|你申请把 ${siteName} 账号的邮箱改为本地址，点下面的按钮确认，确认后立即生效。|">你申请把 Patra 账号的邮箱改为本地址，点下面的按钮确认，确认后立即生效。</span></p>
<th:block th:replace="~{html/fragments/button :: button(${confirmUrl}, '确认新邮箱', |${linkExpiresAt} 前有效 · 只能用一次|)}"></th:block>
<p class="p-fg3 p-rule" style="margin:32px 0 0 0;padding-top:20px;border-top:1px solid #e7e1d4;font-size:13px;line-height:1.6;color:#57534e;">不是你申请的？忽略这封邮件即可，邮箱不会变。</p>
</th:block>
</body>
</html>
