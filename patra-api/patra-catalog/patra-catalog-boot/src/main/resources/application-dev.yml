# ========================================
# Development Environment Configuration
# ========================================
# This configuration is active when spring.profiles.active=dev
# WARNING: Contains development credentials - DO NOT use in production

spring:
  config:
    activate:
      on-profile: dev

  # 禁用 Batch Job 自动启动（通过 XXL-Job 手动触发）
  batch:
    job:
      enabled: false

  # Development database (Mac mini docker, host from $PATRA_INFRA_HOST in zsh env)
  datasource:
    url: jdbc:postgresql://${PATRA_INFRA_HOST:127.0.0.1}:15432/patra_catalog
    username: postgres
    password: 123456  # Development only - secure in production

  # Development Redis (Mac mini docker)
  data:
    redis:
      url: redis://${PATRA_INFRA_HOST:127.0.0.1}:16379
      # 宿主机 DarkWake/短暂抖动时降低误超时概率
      connect-timeout: 10s
      timeout: 30s

  # dev 场景：用 TAILSCALE_IP 注册，确保跨主机服务发现拿到的 IP 可达。
  cloud:
    nacos:
      discovery:
        ip: ${TAILSCALE_IP:}

# 可观测性：开箱即用（零配置）
# - Tracing/Logging: OTel Agent 自动处理
# - Metrics: applicationName 自动取 spring.application.name，environment 自动取 spring.profiles.active

# 开发环境日志降噪（保留全局 DEBUG 能力，仅抑制高频刷屏类）
logging:
  level:
    dev.linqibin.patra.catalog.app.usecase.publication.service.VenueInstanceGatewayImpl: INFO
    dev.linqibin.patra.catalog.infra.adapter.persistence.VenueInstanceRepositoryAdapter: INFO

# Spring Batch 独立数据源（与业务数据库隔离）
linqibin:
  starter:
    batch:
      datasource:
        url: jdbc:postgresql://${PATRA_INFRA_HOST:127.0.0.1}:15432/patra_batch
        username: postgres
        password: 123456
      # 开发环境限制导入记录数（避免每次都导入 2100 万条）
      import-limit:
        max-records: 500000  # 仅导入 50 万条

    # 对象存储配置（MinIO）
    object-storage:
      active-provider: minio
      max-file-size: 5368709120  # 5GB（MeSH 描述符文件约 400MB）
      providers:
        minio:
          endpoint: http://${PATRA_INFRA_HOST:127.0.0.1}:19000
          access-key: minioadmin
          secret-key: minioadmin123
          bucket: patra-catalog-cache

    # 服务间调用连接超时：本地开发放宽到 10s（全局默认 2s，见 application.yml；容器不受影响）。
    # 原因：本地服务经 Nacos 调 mini 容器走 tailscale 子网路由，到网关的通道空闲约 5 分钟被回收；
    # 再次访问要经官方 DERP（香港）重新协商，电信直连香港丢包时首个请求建连实测 3~5s，2s 会直接失败。
    # 详见 patra-infra/docs/mac-mini-connectivity.md §7。
    http-interface:
      connect-timeout: 10s
