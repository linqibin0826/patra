# ============================================================================
# Patra Catalog Service - Main Configuration
# ============================================================================
# Catalog service manages medical literature classification systems,
# MeSH vocabulary, authors, affiliations, and journals.
# ============================================================================

# ----------------------------------------------------------------------------
# Server Configuration
# ----------------------------------------------------------------------------
server:
  port: 6300
  # 解析 Gateway 注入的 X-Forwarded-*（含 Prefix），使 springdoc 生成的 servers 指向对外网关地址
  forward-headers-strategy: framework

# ----------------------------------------------------------------------------
# Spring Boot & Cloud Configuration
# ----------------------------------------------------------------------------
spring:
  # Nacos 的 patra-common.yaml、patra-catalog.yaml 由启动器 PatraApplication 导入，这里不写

  # Batch Job 不在启动时自动执行（catalog 有多个 Job，由 XXL-Job 手动触发）。
  # 缺此项时多 Job 场景启动期报「Job name must be specified in case of multiple jobs」。
  batch:
    job:
      enabled: false

  # Database Configuration
  datasource:
    driver-class-name: org.postgresql.Driver
    # 地址随环境变，在 Nacos 的 patra-catalog.yaml；账号、密码在 patra-common.yaml（源文件在 patra-infra/nacos/dev/）
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000    # 30 seconds
      idle-timeout: 600000          # 10 minutes
      max-lifetime: 1800000         # 30 minutes

  # Flyway Database Migration
  flyway:
    enabled: true
    locations: classpath:db/migration

  # 关闭 OSIV：默认开着时，PDF / 图片下载请求从查库起一直占着 JDBC 连接直到写完（连接池只有 20 条）。
  # 读端都是 native SQL 或在事务内组装，不依赖视图层懒加载。
  jpa:
    open-in-view: false

# ----------------------------------------------------------------------------
# Patra Configuration
# ----------------------------------------------------------------------------
patra:
  object-storage:
    # MeSH 描述符文件约 400MB，默认上限 100MB 不够
    max-file-size: 5368709120  # 5GB
  http-client:
    proxy:
      tunnel:
        # 青果隧道代理：LetPub 等外部爬取经 Apache HttpClient 5 走它。
        # 开关和凭据随环境变，在 Nacos 的 patra-catalog.yaml（dev 关闭）；凭据引用 ${PROXY_AUTH_KEY:}、
        # ${PROXY_AUTH_PWD:}，值放 ~/.patra/secrets/catalog.env。打开后缺凭据，启动期 Assert 会报错。
        # 使用 IP 而非域名，避免 Clash fake-ip DNS 劫持
        # 域名 tun-afbngw.qg.net 对应 IP，可通过 nslookup tun-afbngw.qg.net 8.8.8.8 验证
        host: 112.49.20.234
        port: 15057
    http-interface:
      connect-timeout: 2s
      read-timeout: 5s
      groups:
        registry:
          base-url: lb://patra-registry
          read-timeout: 10s
  web:
    error:
      context-prefix: CAT
  catalog:
    mesh:
      # MeSH Descriptor（主题词）XML 文件 URL - 版本号从文件名自动推断
      descriptor-url: https://nlmpubs.nlm.nih.gov/projects/mesh/MESH_FILES/xmlmesh/desc2026.xml
      # MeSH Qualifier（限定词）XML 文件 URL - 版本号从文件名自动推断
      qualifier-url: https://nlmpubs.nlm.nih.gov/projects/mesh/MESH_FILES/xmlmesh/qual2026.xml
    ror:
      # ROR（Research Organization Registry）机构数据 ZIP 文件 URL - 版本号从文件名自动推断
      # 最新版本下载地址：https://ror.readme.io/docs/data-dump
      download-url: https://zenodo.org/records/17953395/files/v2.0-2025-12-16-ror-data.zip?download=1
    # Scopus API key 随环境变，在 Nacos 的 patra-catalog.yaml（引用 ${SCOPUS_API_KEY:}，值放 ~/.patra/secrets/catalog.env）

# ----------------------------------------------------------------------------
# XXL-Job Distributed Task Scheduler
# ----------------------------------------------------------------------------
xxl:
  job:
    # 管理端地址随环境变，在 Nacos 公共配置 patra-common.yaml
    executor:
      # 回调地址：admin 按它回调本执行器。与 Nacos 注册地址同一个变量；容器里不设，自动探测 patra-net 上的 IP。
      ip: ${PATRA_ADVERTISE_IP:}
      # Log directory in centralized logs folder
      logpath: ${XXL_JOB_EXECUTOR_LOG_PATH:${PATRA_LOG_DIR:logs}/xxl-job/patra-catalog}
      logretentiondays: ${XXL_JOB_LOG_RETENTION_DAYS:30}

# ----------------------------------------------------------------------------
# Logging Configuration
# ----------------------------------------------------------------------------
catalog:
  error-catalog:
    # Repository Errors (1300-1399)
    repository-persistence-failed: CAT-1301
    repository-update-conflict: CAT-1302
    repository-entity-not-found: CAT-1303
