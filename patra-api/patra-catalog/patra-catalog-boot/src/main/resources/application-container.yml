# ========================================
# Production Environment Configuration
# ========================================
# This configuration is active when spring.profiles.active=prod
# All sensitive values are injected via environment variables

spring:
  config:
    activate:
      on-profile: container

  # Batch Job 不在启动时自动执行（catalog 有多个 Job，由 XXL-Job 手动触发）。
  # 缺此项时多 Job 场景启动期报「Job name must be specified in case of multiple jobs」。
  batch:
    job:
      enabled: false

  # Production database (environment variables)
  datasource:
    url: ${CATALOG_DB_URL}
    username: ${CATALOG_DB_USERNAME}
    password: ${CATALOG_DB_PASSWORD}

  # Redis：地址来自 .env.common，密码来自 ~/.patra/secrets/redis.env（compose env_file）
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: default
      password: ${REDIS_PASSWORD}

# Production logging configuration
logging:
  level:
    dev.linqibin: INFO
    dev.linqibin.patra.catalog: INFO

# Spring Batch 独立数据源（与业务数据库隔离）
linqibin:
  starter:
    batch:
      datasource:
        url: ${BATCH_DB_URL}
        username: ${BATCH_DB_USERNAME}
        password: ${BATCH_DB_PASSWORD}

    # 对象存储配置（环境变量注入）
    object-storage:
      active-provider: ${OBJECT_STORAGE_PROVIDER:minio}
      max-file-size: ${MAX_FILE_SIZE:5368709120}  # 默认 5GB
      providers:
        minio:
          endpoint: ${MINIO_ENDPOINT}
          access-key: ${MINIO_ACCESS_KEY}
          secret-key: ${MINIO_SECRET_KEY}
          bucket: ${MINIO_BUCKET:patra-catalog-cache}
