server:
  port: 6400
  # 解析网关注入的 X-Forwarded-*，让 OpenAPI 文档里的地址指向网关
  forward-headers-strategy: framework

spring:
  # 数据源地址、账号、Redis 坐标、身份断言公钥随环境变，在 Nacos：patra-identity.yaml、patra-common.yaml
  # （源文件在 patra-infra/nacos/dev/），由启动器 PatraApplication 导入
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    # 关掉 OSIV：开着时请求第一次查库拿到的连接会一直占到请求结束，
    # Argon2 排队和计算期间也占着，连接池会被一批登录拖垮
    open-in-view: false
  data:
    redis:
      # 所有环境都设超时：Redis 卡住时登录几秒内返回 503，不用等 Lettuce 默认的 60 秒
      connect-timeout: 10s
      timeout: 5s

management:
  health:
    mail:
      # 不拿 SMTP 连通性当健康：容器 healthcheck 每 10 秒一次会变成一天八千多次登录服务商，CD 也不该因此回滚
      enabled: false

patra:
  web:
    error:
      context-prefix: IDN
  identity:
    # 登录失败限制可在线刷新：默认值在 LoginThrottleProperties，要调就在 Nacos 的 patra-identity.yaml 里加键
    password-hashing:
      max-concurrent: 4
      wait-timeout: 3s
    username:
      change-cooldown: 30d       # 两次改名的最短间隔
      reservation-period: 90d    # 旧名保留多久：期间只有原主能改回，/users/旧名 跳到新名
    session:
      max-sessions-per-user: 10
      lifetime:
        user:
          web:
            idle: 30d
            absolute: 180d
    # 邮件：服务商坐标（spring.mail.*）、发件人、门户地址随环境变，在 Nacos 的 patra-identity.yaml
    mail:
      zone: Asia/Shanghai                 # 安全通知里时间的显示时区
      token-retention: 30d                # 过期令牌保留多久后删行
      links:
        verify-email-path: /verify-email          # 门户的验证邮箱落地页
        security-settings-path: /settings/security  # 门户的安全设置页
        reset-password-path: /reset-password          # 门户的重设密码落地页
        confirm-email-change-path: /confirm-email-change  # 门户的确认改邮箱落地页
        revert-email-change-path: /revert-email-change    # 门户的撤销改邮箱落地页
      resend:
        cooldown: 60s
        per-account-hourly: 5
        per-account-daily: 10
        per-ip-hourly: 30
    reauth:
      window: 10m                         # 再认证窗口：改邮箱、踢设备、注销等敏感操作要求这么久内输过密码
    password-reset:
      cooldown: 60s                       # 同邮箱两次申请的最短间隔
      per-email-daily: 5
      per-ip-hourly: 20                   # 受信转发接通（PAP-99）前 IP 是门户地址，等于全站配额
      submit-per-ip-minutely: 10          # 提交重设令牌
    email-change:
      per-account-daily: 3

# XXL-Job 执行器：管理端地址随环境变，在 Nacos 公共配置 patra-common.yaml；执行器端口 = 服务端口 + 1 = 6401
xxl:
  job:
    executor:
      # 回调地址：admin 按它回调本执行器。与 Nacos 注册地址同一个变量；容器里不设，自动探测 patra-net 上的 IP
      ip: ${PATRA_ADVERTISE_IP:}
      logpath: ${XXL_JOB_EXECUTOR_LOG_PATH:${PATRA_LOG_DIR:logs}/xxl-job/patra-identity}
      logretentiondays: ${XXL_JOB_LOG_RETENTION_DAYS:30}
