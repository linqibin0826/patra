server:
  port: 6400
  # 解析网关注入的 X-Forwarded-*，让 OpenAPI 文档里的地址指向网关
  forward-headers-strategy: framework

spring:
  # 数据源地址、账号、Redis 坐标、身份断言公钥随环境变，在 Nacos：patra-identity.yaml、patra-common.yaml
  # （源文件在 patra-infra/nacos/dev/），由启动器 PatraApplication 导入
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    # 关掉 OSIV：开着时请求第一次查库拿到的连接会一直占到请求结束，
    # Argon2 排队和计算期间也占着，连接池会被一批登录拖垮
    open-in-view: false
  data:
    redis:
      # 所有环境都设超时：Redis 卡住时登录几秒内返回 503，不用等 Lettuce 默认的 60 秒
      connect-timeout: 10s
      timeout: 5s

linqibin:
  starter:
    core:
      error:
        context-prefix: IDN

logging:
  file:
    path: ${PATRA_LOG_DIR:logs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

patra:
  identity:
    login-throttle:
      max-failures: 5
      window: 15m
      lock-duration: 15m
      in-flight-ttl: 30s
    password-hashing:
      max-concurrent: 4
      wait-timeout: 3s
    session:
      max-sessions-per-user: 10
      lifetime:
        user:
          web:
            idle: 30d
            absolute: 180d
