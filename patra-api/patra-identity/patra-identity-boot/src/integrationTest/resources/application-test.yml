# 测试里不连 Nacos
spring:
  cloud:
    discovery:
      enabled: false
    nacos:
      discovery:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false

# 对象存储的占位端点：不带 MinIO 的独立 IT 上下文也能装配（不连接）；
# 继承 IdentityFlowITSupport 的流程测试由 IdentityITMinIOContainerInitializer 覆盖成真实容器
patra:
  # 捕获队列按 __TypeId__ 还原安全邮件事件（PAP-104）
  events:
    consumer:
      trusted-packages: dev.patra.identity.api.account.event
  object-storage:
    providers:
      minio:
        endpoint: http://127.0.0.1:1
        access-key: unused
        secret-key: unused

# 测试里不起 XXL-Job 执行器
xxl:
  job:
    enabled: false
