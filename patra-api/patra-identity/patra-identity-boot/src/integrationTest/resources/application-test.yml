# 测试里不连 Nacos
spring:
  cloud:
    discovery:
      enabled: false
    nacos:
      discovery:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false

# 测试里不起 XXL-Job 执行器
xxl:
  job:
    enabled: false

# 镜像 Nacos 里的缺省：无鉴权收集器（Mailpit / GreenMail）时用户名、密码都是空串
spring.mail:
  username: ""
  password: ""
