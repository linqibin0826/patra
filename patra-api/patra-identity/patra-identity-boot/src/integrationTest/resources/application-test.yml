# 测试里不连 Nacos
spring:
  cloud:
    discovery:
      enabled: false
    nacos:
      discovery:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false

# 第三方登录的客户端占位值：真实环境来自 ~/.patra/secrets/oauth.env；令牌等端点只有流程测试才指到 WireMock
PATRA_OAUTH_GOOGLE_CLIENT_ID: test-google-client
PATRA_OAUTH_GOOGLE_CLIENT_SECRET: test-google-secret
PATRA_OAUTH_GITHUB_CLIENT_ID: test-github-client
PATRA_OAUTH_GITHUB_CLIENT_SECRET: test-github-secret
PATRA_OAUTH_ORCID_CLIENT_ID: test-orcid-client
PATRA_OAUTH_ORCID_CLIENT_SECRET: test-orcid-secret

# 对象存储的占位端点：不带 MinIO 的独立 IT 上下文也能装配（不连接）；
# 继承 IdentityFlowITSupport 的流程测试由 IdentityITMinIOContainerInitializer 覆盖成真实容器
patra:
  # 人机验证的占位值：真实环境来自 Nacos 和 ~/.patra/secrets/identity.env；流程测试把地址指到 WireMock
  identity:
    human-verification:
      turnstile:
        base-url: http://127.0.0.1:1
        site-key: test-turnstile-site
        secret: test-turnstile-value
        allowed-hostnames: [patra.test]
      trust-turn:
        base-url: http://127.0.0.1:1
        site-key: test-trustturn-site
        app-secret: test-trustturn-value
        allowed-origins: [https://patra.test]
  # 捕获队列按 __TypeId__ 还原安全邮件事件（PAP-104）
  events:
    consumer:
      trusted-packages: dev.patra.identity.api.account.event
  object-storage:
    providers:
      minio:
        endpoint: http://127.0.0.1:1
        access-key: unused
        secret-key: unused

# 测试里不起 XXL-Job 执行器
xxl:
  job:
    enabled: false
