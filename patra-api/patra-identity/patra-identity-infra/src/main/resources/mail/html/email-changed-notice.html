<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${subject}">你的 Patra 邮箱已更改</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f4;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f4;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0"
             style="max-width:600px;width:100%;background:#ffffff;border:1px solid #e7e5e4;border-radius:8px;">
        <tr th:replace="~{html/fragments/layout :: header}"></tr>
        <tr>
          <td style="padding:8px 32px 24px 32px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.8;color:#1c1917;">
            <p style="margin:0 0 12px 0;">你好，<span th:text="${displayName}">陈宇</span>：</p>
            <p style="margin:0 0 12px 0;">你的 Patra 账号邮箱已从本地址改为 <span th:text="${newEmailMasked}">c***@example.com</span>，本地址不再能登录。</p>
            <table th:replace="~{html/fragments/security-notice :: notice(${notice})}"></table>
            <p style="margin:0 0 12px 0;font-size:13px;color:#57534e;">如果不是你，请点下面的按钮撤销：邮箱会改回本地址，所有设备下线，并给你发重设密码的链接。</p>
            <p style="margin:0 0 20px 0;">
              <a th:href="${revertUrl}" href="#"
                 style="display:inline-block;background:#b45309;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:6px;">不是我，撤销更改</a>
            </p>
            <p style="margin:0 0 6px 0;font-size:13px;color:#57534e;">按钮打不开时，把下面的链接复制到浏览器地址栏：</p>
            <p style="margin:0 0 20px 0;font-size:13px;word-break:break-all;">
              <a th:href="${revertUrl}" th:text="${revertUrl}" href="#" style="color:#b45309;">https://example/#token=…</a>
            </p>
            <p style="margin:0 0 12px 0;font-size:13px;color:#57534e;" th:text="|撤销链接 ${validDays} 天内有效。|">撤销链接 7 天内有效。</p>
            <p style="margin:0 0 12px 0;font-size:13px;color:#57534e;">建议立即到<a th:href="${securityUrl}" href="#" style="color:#b45309;">安全设置</a>修改密码并检查登录设备。</p>
          </td>
        </tr>
        <tr th:replace="~{html/fragments/layout :: footer}"></tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
