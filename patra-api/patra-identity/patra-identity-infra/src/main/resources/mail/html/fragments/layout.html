<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 抬头：站名 -->
<tr th:fragment="header">
  <td style="padding:28px 32px 8px 32px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;">
    <span style="font-size:20px;font-weight:600;color:#1c1917;letter-spacing:0.02em;" th:text="${siteName}">Patra</span>
    <span style="font-size:13px;color:#78716c;margin-left:8px;">医学文献平台</span>
  </td>
</tr>
<!-- 页脚：固定提示 -->
<tr th:fragment="footer">
  <td style="padding:20px 32px 28px 32px;border-top:1px solid #e7e5e4;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.7;color:#78716c;">
    <p style="margin:0;" th:text="|此邮件由 ${siteName} 系统自动发出，请勿回复。|">此邮件由 Patra 系统自动发出，请勿回复。</p>
    <p style="margin:0;" th:text="|${siteName} 不会在邮件里向你索要密码。|">Patra 不会在邮件里向你索要密码。</p>
  </td>
</tr>
</body>
</html>
