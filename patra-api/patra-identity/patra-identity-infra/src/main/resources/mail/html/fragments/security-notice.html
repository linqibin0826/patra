<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 安全通知共用片段：时间、设备、IP 与属地三行事实表，加「不是你本人的操作？」提示块。n 是 SecurityNoticeView。
     「到安全设置」一句由各模板按场景自己写：改回邮箱后密码已作废的人登不进去 -->
<th:block th:fragment="notice(n)">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" class="p-rule-strong"
       style="margin-top:28px;border-top:1px solid #1c1917;border-bottom:1px solid #ddd5c4;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;">
  <tr>
    <td class="p-fg3 p-rule" width="88" style="width:88px;padding:14px 16px 14px 0;border-bottom:1px solid #e7e1d4;vertical-align:top;font-family:'SF Mono',Menlo,Consolas,'PingFang SC',monospace;font-size:11px;line-height:20px;letter-spacing:0.08em;color:#57534e;">时间</td>
    <td class="p-fg1 p-rule" style="padding:14px 0;border-bottom:1px solid #e7e1d4;font-family:'SF Mono',Menlo,Consolas,'PingFang SC',monospace;font-size:14px;line-height:20px;color:#1c1917;" th:text="${n.occurredAt}">2026-10-21 16:30 (UTC+8)</td>
  </tr>
  <tr>
    <td class="p-fg3 p-rule" width="88" style="width:88px;padding:14px 16px 14px 0;border-bottom:1px solid #e7e1d4;vertical-align:top;font-family:'SF Mono',Menlo,Consolas,'PingFang SC',monospace;font-size:11px;line-height:20px;letter-spacing:0.08em;color:#57534e;">设备</td>
    <td class="p-fg1 p-rule" style="padding:14px 0;border-bottom:1px solid #e7e1d4;font-size:14px;line-height:20px;color:#1c1917;" th:text="${n.device}">未知</td>
  </tr>
  <tr>
    <td class="p-fg3" width="88" style="width:88px;padding:14px 16px 14px 0;vertical-align:top;font-family:'SF Mono',Menlo,Consolas,'PingFang SC',monospace;font-size:11px;line-height:20px;letter-spacing:0.08em;color:#57534e;">IP 与属地</td>
    <td class="p-fg1" style="padding:14px 0;font-size:14px;line-height:20px;color:#1c1917;" th:text="${n.ip}">未知</td>
  </tr>
</table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top:24px;">
  <tr>
    <td class="p-tint" style="padding:18px 20px;background:#fbf1e8;border:1px solid #e9c39b;border-radius:8px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;">
      <p class="p-fg1" style="margin:0 0 6px 0;font-size:15px;font-weight:500;line-height:1.6;color:#1c1917;">不是你本人的操作？</p>
      <p class="p-fg2" style="margin:0;font-size:14px;line-height:1.7;color:#44403c;" th:text="${n.notMeAdvice}">请立即修改密码</p>
    </td>
  </tr>
</table>
</th:block>
</body>
</html>
