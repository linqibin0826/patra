# Registry Infra 集成测试配置
# 使用 target 版本限制，跳过种子数据迁移（DictionarySeedIT 单独覆盖为 latest）

spring:
  flyway:
    # 只执行到 V1（schema 迁移），跳过 V2、V3 种子数据
    target: 1
    # 允许清理数据库（仅用于测试）
    clean-disabled: false
    # 设置 baseline 跳过已存在的迁移历史检查
    baseline-on-migrate: true
# 注意：Jackson 3.x FormatMapper 通过 HibernatePropertiesCustomizer 自动配置，它构造注入容器 JsonMapper
# @DataJpaTest 需要在 @Import 中显式添加 HibernatePropertiesCustomizer.class，
# 并在 @ImportAutoConfiguration 中添加 Boot 的 JacksonAutoConfiguration.class（切片不含 Jackson）
