# Registry Infra 集成测试配置
# 只跑建表脚本、不灌种子：种子在 db/seed，服务配置才把它加进 Flyway 位置（DictionarySeedIT 单独加上）

spring:
  flyway:
    locations: classpath:db/migration
    # 同一个 JVM 里的集成测试共用一个库：DictionarySeedIT 先跑的话，种子脚本已记在历史表里，
    # 别的上下文本地没有 db/seed，校验时会报「已执行的脚本找不到」，这里放行
    ignore-migration-patterns: "*:missing,*:future"
    # 允许清理数据库（仅用于测试）
    clean-disabled: false
    # 设置 baseline 跳过已存在的迁移历史检查
    baseline-on-migrate: true
# 注意：Jackson 3.x FormatMapper 通过 HibernatePropertiesCustomizer 自动配置，它构造注入容器 JsonMapper
# @DataJpaTest 需要在 @Import 中显式添加 HibernatePropertiesCustomizer.class，
# 并在 @ImportAutoConfiguration 中添加 Boot 的 JacksonAutoConfiguration.class（切片不含 Jackson）
