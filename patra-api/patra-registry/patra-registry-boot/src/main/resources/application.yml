# ========================================
# Patra Registry Service Configuration
# ========================================
# Single Source of Truth for platform dictionaries and their reference standards.
# Other services query this via HTTP Interface.

# ========================================
# Server Configuration
# ========================================
server:
  port: 6000
  # 解析 Gateway 注入的 X-Forwarded-*（含 Prefix），使 springdoc 生成的 servers 指向对外网关地址
  forward-headers-strategy: framework
  # Tomcat Keep-Alive 配置 - 防止客户端遇到 stale connection 错误
  # 参考: https://github.com/spring-projects/spring-boot/issues/23539
  tomcat:
    keep-alive-timeout: 120s       # Keep-Alive 超时（应大于客户端超时）
    max-keep-alive-requests: 1000  # 单连接最大请求数

# ========================================
# Spring Application Configuration
# ========================================
spring:
  # Nacos 的 patra-common.yaml、patra-registry.yaml 由启动器 PatraApplication 导入，这里不写

  # ========================================
  # JSON Serialization Configuration
  # ========================================
  # 注意：Spring Boot 4.0 + Jackson 3.x 中 write-dates-as-timestamps 和 fail-on-unknown-properties
  # 已不再是有效的配置属性。Jackson 3.x 默认使用 ISO-8601 格式序列化日期，
  # 未知属性的处理通过 ObjectMapper 配置或 @JsonIgnoreProperties 注解控制。

  # ========================================
  # Database Configuration
  # ========================================
  datasource:
    driver-class-name: org.postgresql.Driver
    # 地址、账号、密码随环境变，在 Nacos：patra-registry.yaml、patra-common.yaml（源文件在 patra-infra/nacos/dev/）
    hikari:
      # Connection pool settings
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000    # 30 seconds
      idle-timeout: 600000          # 10 minutes
      max-lifetime: 1800000         # 30 minutes

  # ========================================
  # Flyway Database Migration
  # ========================================
  flyway:
    enabled: true
    locations: classpath:db/migration

# ========================================
# Logging Configuration
# ========================================
patra:
  web:
    error:
      context-prefix: REG
      type-base-url: https://errors.patra.com

registry:
  error-catalog:
    dictionary-type-not-found: REG-1401
    dictionary-item-not-found: REG-1402
    dictionary-item-disabled: REG-1403
    dictionary-type-already-exists: REG-1404
    dictionary-item-already-exists: REG-1405
    dictionary-type-disabled: REG-1406
    dictionary-validation-failed: REG-1407
    dictionary-default-missing: REG-1408
    dictionary-repository-error: REG-1409
    quota-exceeded: REG-1501
