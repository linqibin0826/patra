# 测试里不连 Nacos
spring:
  cloud:
    discovery:
      enabled: false
    nacos:
      discovery:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false

# 测试里不起 XXL-Job 执行器
xxl:
  job:
    enabled: false

# 测试里不往 OTel Collector 推指标
management:
  otlp:
    metrics:
      export:
        enabled: false
