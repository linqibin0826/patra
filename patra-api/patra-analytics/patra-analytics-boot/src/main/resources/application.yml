server:
  port: 6700
  # 解析网关注入的 X-Forwarded-*，让 OpenAPI 文档里的地址指向网关
  forward-headers-strategy: framework

spring:
  # 数据源、Redis、Kafka 的地址与账号随环境变，在 Nacos：patra-analytics.yaml、patra-common.yaml
  # （源文件在 patra-infra/nacos/dev/），由启动器 PatraApplication 导入
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # 阅读历史（PAP-169）用；采集请求里同步写历史
      maximum-pool-size: 5
      minimum-idle: 1
      # 拿连接最多等 500 ms：PG 卡住时写历史很快失败、不拖慢采集（门户的超时是 6 秒），历史接口也快速失败
      connection-timeout: 500
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    # 递归扫描：每个子域的脚本在 db/migration/{子域}/
    locations: classpath:db/migration
  jpa:
    open-in-view: false
  data:
    redis:
      # 爬虫频率规则查 Redis：卡住时宁可跳过规则也不拖慢采集（门户调采集端点的超时是 6 秒）
      timeout: 500ms
      connect-timeout: 500ms

patra:
  web:
    error:
      context-prefix: ANALYTICS
  http-client:
    http-interface:
      groups:
        # 注销清理按主键批量取账号状态（毫秒级）：超时压短，identity 卡住时这一批很快跳过
        identity:
          base-url: lb://patra-identity
          connect-timeout: 1s
          read-timeout: 2s
        # 热读、共现任务按 100 个一批核对文献；看过还看了请求时取同主题邻居（毫秒级，结果缓存 6 小时）
        catalog:
          base-url: lb://patra-catalog
          connect-timeout: 1s
          read-timeout: 2s
  analytics:
    ingest:
      # 入库消费者（PAP-168）；测试里默认关，只有入库的集成测试打开
      enabled: true
      group-id: patra-analytics-ingest
    # ip2region 离线库目录（与 identity 共用 scripts/fetch-ip2region.sh 下载的文件）；容器里由 compose 的环境变量覆盖
    ip-geolocation:
      directory: ${user.home}/.patra/data/ip2region

management:
  otlp:
    metrics:
      export:
        # 采集指标经 OTLP 推给 OTel Collector，再由它的 Prometheus 导出器给 Prometheus（.claude/rules/tech/observability.md）。
        # mini 上 apps 容器经 extra_hosts 回到宿主机的 4318；本机开发连 mini 的同一端口
        url: http://${PATRA_INFRA_HOST:127.0.0.1}:4318/v1/metrics
        step: 30s
        # 计时按秒导出，经 Prometheus 导出器后与其他服务一样是 *_seconds_*
        base-time-unit: seconds

# XXL-Job 执行器：管理端地址在 Nacos 公共配置 patra-common.yaml；执行器端口 = 服务端口 + 1 = 6701
xxl:
  job:
    executor:
      ip: ${PATRA_ADVERTISE_IP:}
      logpath: ${XXL_JOB_EXECUTOR_LOG_PATH:${PATRA_LOG_DIR:logs}/xxl-job/patra-analytics}
      logretentiondays: ${XXL_JOB_LOG_RETENTION_DAYS:30}
