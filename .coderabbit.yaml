# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Patra CodeRabbit 配置。原则：降 rate limit（关增量）+ 降噪 + 工具聚合 + TDD 约束 + Linear。
# 分工：CodeRabbit=广度（行级 nitpick + lint/安全工具聚合 + AC），Codex=PR ready 时自动的补充评审，
# Claude=深度（六边形架构 + DDD 领域逻辑）。每个 PR 只做首评（Claude 手动 @ 触发），不复评：
# 0 star 公开仓库的 OSS 额度仅每小时 1 次 PR 评审。
language: zh-CN
tone_instructions: 用中文 review；工程师同事语气，直接指出 bug 与设计风险；如无明确问题不发表评论；避免礼貌性赞美。

reviews:
  profile: chill
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_instructions: |
    摘要聚焦：① 变更了哪个六边形层（domain/app/adapter/infra/portal）；
    ② 涉及哪个领域概念或外部数据源；③ 是否含 Flyway 迁移或破坏性 schema 变更。不要重复文件列表。
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: false
  related_prs: false
  poem: false
  review_status: false
  commit_status: false
  fail_commit_status: false
  auto_apply_labels: true

  auto_review:
    enabled: false                        # 关自动评审：首评由 @coderabbitai review 手动触发，不复评
    auto_incremental_review: false        # 关增量复评（enabled: false 时冗余，双保险留着）
    drafts: false
    ignore_title_keywords:
      - WIP
      - DO NOT MERGE
      - SKIP REVIEW
    ignore_usernames:
      - dependabot[bot]
      - renovate[bot]

  pre_merge_checks:
    custom_checks:
      - name: "TDD-测试先行"
        mode: warning   # request_changes_workflow=false 下只能 warning（提示，不阻断）
        instructions: |
          每个新增 production class 或 public method 应有对应 *Test.java 或 *IT.java 变更。
          只含测试文件变更（Red 阶段）视为合规；含 production 代码但零测试变更 → 标记违反。
          例外：patra-*-api 的 DTO/Contract record 不强制单测。

  finishing_touches:
    docstrings:
      enabled: false   # TDD：禁止 AI 事后补 JavaDoc
    unit_tests:
      enabled: false   # TDD：禁止 AI 事后补测试

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/src/main/generated/**"
    - "!**/*.generated.java"
    - "!**/__snapshots__/**"
    - "!**/*.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/gradle/wrapper/**"
    - "!gradlew"
    - "!gradlew.bat"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/CHANGELOG.md"

  path_instructions:
    - path: "**/patra-*-domain/**/*.java"
      instructions: |
        DDD domain 层：禁止依赖 Spring/JPA/任何框架。关注充血模型、不变量、领域事件；
        指出贫血实体、跨聚合直接引用、把基础设施类型暴露到 domain。
        【让给 Claude】聚合边界等深层架构评审由 Claude 负责，此处聚焦框架依赖污染。
    - path: "**/patra-*-app/**/*.java"
      instructions: |
        Application 层：用例编排与事务边界，不放业务规则。
        【不要评论】@Transactional 放 Service 而非 Repository 的框架约定写法。
    - path: "**/patra-*-adapter/**/*.java"
      instructions: |
        Adapter 层：指出 DTO ↔ 领域模型双向耦合、领域类型外泄到对外契约、缺输入校验。
    - path: "**/patra-*-infra/**/*.java"
      instructions: |
        Infrastructure 层：指出实体直接外泄、N+1、资源未释放。
        【不要评论】Spring Data JPA 标准 Repository 继承写法。
    - path: "**/patra-common-*/**/*.java"
      instructions: |
        通用模块：所有 public API 变更须评估对全部消费服务的破坏性影响；禁止引入重型框架依赖。
    - path: "**/patra-spring-boot-starter-*/**/*.java"
      instructions: |
        Starter：AutoConfiguration 须有 @ConditionalOn* 保护；评估与其他 starter 的 Bean 冲突；
        META-INF/spring 注册文件须与 AutoConfiguration 同步。
    - path: "patra-portal/**/*.ts"
      instructions: |
        Next.js 15 / React 19 / TS strict / Tailwind v4 / shadcn/ui。指出 any、未处理 Promise、
        客户端组件泄漏 Server Action。text-fg-3/border-border-default 是空操作，用 text-[var(--fg-3)]。
    - path: "patra-portal/**/*.tsx"
      instructions: |
        同 .ts：Next.js 15 / React 19 / TS strict。指出 any、未处理 Promise、Server Action 泄漏、
        违反 shadcn/ui 样式约定。
    - path: "**/db/migration/**/*.sql"
      instructions: |
        Flyway 迁移：检查索引、可空性、默认值、可逆性、大表 ALTER 锁表风险；提交后禁止改（checksum）。
    - path: "**/*Test.java"
      instructions: |
        断言须覆盖失败路径与边界值；测试名表达 given/when/then；禁止空测试体、Thread.sleep 等待。
    - path: "**/*IT.java"
      instructions: |
        集成测试：不要 mock 内部实现；DB 测试用 @Transactional 回滚或 Testcontainers 隔离。
    - path: "**/*.gradle.kts"
      instructions: |
        依赖 scope 是否正确（implementation/testImplementation/runtimeOnly/compileOnly）；避免重复依赖。
    - path: ".github/workflows/**/*.yml"
      instructions: |
        禁止硬编码 secret（须 ${{ secrets.X }}）；禁止 permissions: write-all；action 须 pin 到 SHA；
        Java 步骤用 JDK 25 + gradlew。
    - path: ".github/workflows/**/*.yaml"
      instructions: |
        同 .yml：禁硬编码 secret、禁 write-all、pin SHA、JDK 25 + gradlew。

  tools:
    fbinfer:
      enabled: true
      enable_java: true        # 默认 false，Java 项目必须显式开
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    checkov:
      enabled: true
    trivy:
      enabled: true
    hadolint:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    osvScanner:
      enabled: true
    opengrep:
      enabled: true
    ast-grep:
      essential_rules: true
    pmd:
      enabled: false           # CI 已有 SpotBugs
    semgrep:
      enabled: false           # opengrep 覆盖
    biome:
      enabled: false
    detekt:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - ".claude/rules/**/*.md"   # 吸收 code-style/port-service/error-handling 规约
  learnings:
    scope: local
  linear:
    usage: enabled
    team_keys:
      - PAP
  jira:
    usage: disabled

chat:
  auto_reply: false
